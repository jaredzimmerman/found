  /* ---------- themes ----------

     The whole palette is a token swap. Every colour in the stylesheet resolves
     to one of the nine variables in :root, and nothing outside that block
     hardcodes a colour, so a theme is just a different set of values.

     data-theme is set on <html> BEFORE first paint (see the inline script in
     <head>), so there is no flash of the wrong paper.

     --ink is used for text AND for the halftone screen, which is the one place
     the two themes genuinely interact: the screen is `mix-blend-mode:multiply`
     over the photograph, so its colour has to be the theme's ink, not a
     hardcoded black, or the dots read as grey sludge on a dark page. */
  :root{
    --ink:#0a0a0a;
    --ink-2:#3d3d3d;
    --ink-3:#6e6e6e;
    --rule:#0a0a0a;
    --hair:#c9c9c9;
    --hair-2:#e4e4e4;
    --paper:#fbfaf7;
    --paper-2:#f2f0ea;
    --accent:#8c1c13;
    --max:1180px;

    /* Theme-dependent, not part of the palette above. */
    --fibre:rgba(0,0,0,.014);   /* the newsprint tooth */
    --shadow:0 10px 22px -20px rgba(0,0,0,.5);
    /* Halftone plate (see "artwork: a real halftone"). Geometry is shared by all
       themes; polarity is not: ink-on-paper for light and pink, light ink on a
       dark paper for dark. */
    --ht-cell:4px;            /* dot pitch along the rotated grid */
    --ht-cone:2.6px;          /* cone radius. The biggest dot is ~.85 of this (2.2px, ~89% ink),
                                 so even pure black keeps a lattice of paper. At 2.9px every tone
                                 below .5 printed 81-97% ink: the dots overlapped and the shadows
                                 fused into one muddy black mass. */
    --ht-k:.588;              /* brightness that puts the cut at tone .85 */
    --ht-K:9;                 /* contrast: the hard threshold */
    --ht-blur:.5px;           /* average the tone over a cell */
    --ht-inv:0;
    --ht-blend:multiply;
    --ht-tint:lighten;
  }

  /* Dead code removed 2026-09-30: an earlier, lower-contrast pair of dark/pink
     blocks (--ink:#fafafa / #5a0000, etc.) used to sit here. Both were fully
     shadowed by the pair below — same selector, later in the file always wins
     a tie, so every property they shared with the pair below was already
     dead; --dot-cell and --max were the only properties NOT repeated below,
     and both matched :root's own value (2px, 1180px) anyway, so removing the
     block changes nothing rendered. Editing this dead block was a trap: the
     page would not react. See [[github rtk memory: fog-and-found-drift]]. */

  /* Light is the default above; these two are opt-in. The dark theme is not a
     filter: each token is chosen so that contrast holds on a dark paper, and
     the rules are lighter than the light theme's because a #141414 hairline on
     a #141414 page is invisible. */
  html[data-theme="dark"]{
    --ink:#f2eee6;
    --ink-2:#b8b2a6;
    --ink-3:#8b8578;
    --rule:#e8e2d6;
    --hair:#3a3a3a;
    --hair-2:#262626;
    --paper:#141414;
    --paper-2:#1e1e1e;
    --accent:#e8836b;
    --fibre:rgba(255,255,255,.016);
    --shadow:0 10px 22px -20px rgba(0,0,0,.85);
    --ht-inv:1;               /* light dots on dark paper: invert the photo AND the plate */
    --ht-blend:screen;
    --ht-tint:darken;
  }
  html[data-theme="pink"]{
    --ink:#2a1016;
    --ink-2:#6b2b3d;
    --ink-3:#8f5566;
    --rule:#2a1016;
    --hair:#f3c4da;
    --hair-2:#e9a9c6;
    --paper:#FFAEDB;
    --paper-2:#f7a2d2;
    --accent:#7a1030;
    --fibre:rgba(42,16,22,.05);
    --shadow:0 10px 22px -20px rgba(42,16,22,.55);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Archivo,"Archivo Fallback","Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    line-height:1.45;
    /* the faint fibre of newsprint */
    background-image:
      repeating-linear-gradient(0deg,var(--fibre) 0 1px,transparent 1px 3px);
  }
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

  /* ---------- skip link ----------
     A keyboard user arriving from a search result has to tab past the theme
     radio group, the day rail and the search field before reaching a single
     listing — the filter bar is deliberately open-looking furniture at the top
     of the document. The link is the first focusable thing on the page and is
     invisible until focused, so it costs a sighted reader nothing. */
  .skip{
    position:absolute;left:8px;top:8px;z-index:100;
    transform:translateY(-160%);
    background:var(--ink);color:var(--paper);
    padding:10px 16px;font-size:12px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;
    text-decoration:none;white-space:nowrap;
  }
  .skip:focus-visible{transform:translateY(0);outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- masthead ---------- */
  .masthead{border-bottom:3px double var(--rule);padding:22px 0 12px}
  .kicker{
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);border-bottom:1px solid var(--hair);padding-bottom:8px;margin-bottom:14px;flex-wrap:wrap;
  }
  .kicker b{color:var(--ink);font-weight:700}
  .kicker #stamp.stale{font-style:italic;text-transform:none;letter-spacing:.04em;color:var(--ink-2)}

  /* ---------- city switch ----------
     The trigger is a <button> only because a button is focusable and can carry
     aria-expanded. Visually it must be indistinguishable from the <b> it
     replaced: no underline, no border, no caret, no hover colour shift beyond
     the faintest ink-3. A visible affordance here would turn "the city is a
     label" into "the city is a control", which is what the reader asked to
     avoid — so the only cue is the cursor. */
  .place{position:relative;display:inline-flex;align-items:baseline;gap:0}
  .place-btn{
    font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink);
    font-weight:700;background:none;border:0;padding:0;margin:0;cursor:pointer;
  }
  .place-btn:focus-visible{outline:1px dotted var(--ink-3);outline-offset:3px}
  .place-menu{
    position:absolute;top:calc(100% + 7px);left:0;z-index:60;
    display:flex;flex-direction:column;min-width:100%;
    background:var(--paper);border:1px solid var(--ink-3);border-radius:2px;
    box-shadow:0 6px 20px rgba(0,0,0,.14);
  }
  .place-menu[hidden]{display:none}
  .place-opt{
    font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink-2);
    background:none;border:0;text-align:left;padding:7px 14px 7px 12px;cursor:pointer;
    white-space:nowrap;
  }
  .place-opt:hover{background:var(--ink);color:var(--paper)}
  .place-opt[aria-checked="true"]{color:var(--ink);font-weight:700}
  .place-opt[aria-checked="true"]::before{content:"\2014\00a0"}

  /* ---------- theme control ----------
     Sits inline with the stamp, right-aligned in the kicker. The labels are
     the hit area; the input is visually hidden but NOT display:none, so it
     stays focusable and the keyboard still works. */
  .kicker-right{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .themes{
    display:inline-flex;align-items:stretch;
    border:1px solid var(--hair);border-radius:2px;overflow:hidden;
  }
  .theme{position:relative;display:inline-flex;margin:0}
  .theme+.theme{border-left:1px solid var(--hair)}
  .theme input{
    position:absolute;inset:0;width:100%;height:100%;
    margin:0;padding:0;opacity:0;cursor:pointer;
  }
  .theme span{
    display:block;padding:4px 9px;
    font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);background:transparent;
    transition:background .12s,color .12s;
    text-decoration:none;
    white-space:nowrap;
  }
  .theme:hover span{color:var(--ink)}
  .theme input:checked+span{
    color:var(--paper);background:var(--ink);
  }
  .theme input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
  /* A radio is the selected state; the underline is the indicator. */
  .theme input:checked+span{box-shadow:inset 0 -2px 0 currentColor}
  /* The date range is spelled out in full at desktop width, where there is
     room. On a phone the day chips below already say "Tuesday / Wednesday /
     Thursday", so the long form is pure duplication — and it is what pushed
     the kicker onto five lines. Collapse it to a short range there instead. */
  .kicker .range-long{display:inline}
  .kicker .range-short{display:none}
  .title{
    font-family:"Playfair Display","Playfair Display Fallback",Georgia,serif;
    font-weight:900;font-size:clamp(46px,11vw,132px);
    line-height:.82;letter-spacing:-.035em;margin:0;
    text-align:center;text-transform:uppercase;
    /* An 11vw wordmark set solid reads as a slab; a whisper of tracking keeps
       the counters open at the display sizes. */
    text-wrap:balance;
    /* The tracking is NEGATIVE, and letter-spacing is applied after every glyph
       including the last, so the line box ends 0.035em short of the ink: the box
       is centred, the letters are not (measured 1.7px right of centre at 132px).
       Padding the trailing edge by the same amount moves the content box back so
       the INK is what sits on the centre line. */
    padding-right:.035em;
  }
  .standfirst{
    /* No max-width: this line is `nowrap`, and a 60ch cap made the BOX narrower
       than its own text, so the box was centred but the text ran out of its
       right edge — 99px right of the logotype's centre at 1440px. With the box
       as wide as the column, text-align:center centres the text itself. The
       wrapping layouts below <=980px set their own max-width. */
    text-align:center;max-width:none;margin:14px auto 0;
    font-size:14px;color:var(--ink-2);line-height:1.5;
    /* A single unbreakable line on desktop: it reads as the dek for the
       edition, not as an interactive element. `text-wrap: nowrap` prevents word
       break, and `white-space: nowrap` keeps the whole phrase on one line. On
       a narrow screen the chips close and the bar collapses, and this rule is
       overridden — the standfirst returns to multi-line readability then. */
    text-wrap:nowrap;white-space:nowrap;
  }
  .standfirst em{color:var(--ink);font-style:italic}

  /* ---------- filter bar ---------- */
  .filters{
    position:sticky;top:0;z-index:40;background:var(--paper);
    border-bottom:1px solid var(--rule);
    box-shadow:var(--shadow);
  }
  /* Only the VERTICAL padding belongs here. This element is also .wrap, which
     supplies the side inset (24px desktop, 16px phone) that aligns the bar
     with the masthead. Writing `padding:12px 0` here zeroed that inset, so
     the Filters button sat hard against the viewport edge while the kicker
     above it was inset — a 24px misalignment at desktop, 16px on a phone. */
  .filters-in{padding:12px 24px}
  /* The panel OVERLAYS the page instead of pushing it down.

     `position:sticky` on the bar does not take the bar out of flow — a sticky
     box still occupies its original place, and everything after it flows below
     that place. So a sticky bar with a 302px panel inside it added 302px to
     the document height and shoved every listing down by 302px the moment the
     reader opened Filters. Measured on the live site: the day heading a reader
     had scrolled to moved from y=0 to y=359, and `scrollY` was silently
     rewritten from 1200 to 1502. The controls in the bar itself did not move,
     which is why this survived every check that only looked at the bar.

     The panel is absolutely positioned against the bar (which is sticky, so it
     is a containing block) and given a solid background, so it covers the
     listings while it is open and costs the document nothing.

     `top:100%` puts it flush under the bar's padding box; the bar's own bottom
     border and shadow read as the panel's top edge, so the two read as one
     panel rather than as a detached sheet. */
  .frow{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-areas:
      "type  type  type  type"
      "hood  hood  hood  hood"
      "price avail link  venue";
    column-gap:24px;row-gap:16px;
    position:absolute;left:0;right:0;top:100%;z-index:39;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
    box-shadow:0 10px 18px -8px var(--shadow);
    /* The panel carries its OWN inset, matching `.wrap`. It used to inherit
       the inset from being inside `.filters-in`, but taking it out of flow
       means it is no longer inside that padded box — so without this the chips
       sit hard against the viewport edge at x=0 and x=1440 while every other
       line on the page is inset. The phone value is overridden below. */
    padding:12px 24px;
  }
  .fgroup--type{grid-area:type}
  .fgroup--price{grid-area:price}
  .fgroup--avail{grid-area:avail}
  .fgroup--hood{grid-area:hood}
  .fgroup--link{grid-area:link}
  .fgroup--venue{grid-area:venue}

  /* The always-visible rail. On desktop the full row shows under it; on a
     phone it is the whole bar, so the tall chip list is opt-in rather than
     eating the viewport. */
  .fbar-top{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  }
  .fbar-top .brand{flex:0 0 auto}

  /* ---- the scroll-in wordmark ------------------------------------------
     At the top of the page the masthead above already reads "Fog & Found", so
     printing it again in the bar is duplication. The bar therefore starts
     with the wordmark collapsed to zero width: the search sits flush left in
     the content margin, exactly where the reader expects the first control.

     When the masthead scrolls out, the wordmark is needed — it is the only
     thing on the page still saying which paper this is. So it animates in
     FROM THE LEFT: it grows out of the left margin, and the search slides
     right to make room. Nothing pops, and nothing overlaps the controls on
     the right, because the growth is animated on both sides of the word.

     `grid-template-columns` on the bar is what carries this: a column that is
     0px at rest and auto once `.scrolled` is set, with the search in a second
     column. The row is a flex container, so the brand is instead given a
     max-width that transitions 0 -> its natural width; `flex:0 0 auto` with a
     `max-width` is what lets a flex item shrink to nothing without the row
     reflowing the other items. */
  .fbar-top{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  }
  /* The wordmark's layout box is reserved at its full measured width from
     the very start — not grown from 0 — so nothing downstream of it (the
     search field, the day chips, Only Free, Filters) ever has a reason to
     shift position. Only its OPACITY animates between "masthead visible"
     and "scrolled past it"; the empty reserved slot at rest is the
     deliberate trade for every other control staying exactly where it is,
     always. `measureBrand()` writes --brand-w-full once the font has
     loaded; 105px (measured at 1280px/22px Playfair) is the fallback
     before that runs or if the name ever changes language.

     This used to be position:absolute with an animated width, and
     .search-wrap carried a matching margin-left that grew in step — so the
     search box (and everything after it) visibly slid right on every
     scroll across the masthead boundary. Taking the wordmark out of flow
     didn't stop the row from moving; it just moved the motion into the
     search box's own margin instead. */
  .fbar-top .brand{
    /* Centred on the row, not baseline-aligned: the wordmark is 22px serif caps
       beside 11-13px sans controls, and a shared baseline puts its caps ~6px
       ABOVE the row's middle. Measured optical centre (cap top to baseline)
       vs the Filters button: -6.5px baseline-aligned, +1.2px centred (the
       `top:-1px` on the <b> below closes the last of it). */
    align-self:center;display:flex;align-items:center;line-height:1;
    flex:0 0 auto;
    width:var(--brand-w-full,105px);
    overflow:hidden;
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
    transition:opacity .2s linear;
  }
  .filters.scrolled .fbar-top .brand{
    opacity:1;
    pointer-events:auto;
  }
  /* Below this the bar has no room for the reserved wordmark slot AND the
     search on one line — collapse the slot to 0 rather than let the row
     wrap unpredictably. The masthead is a few hundred pixels up, so the
     name is not lost, only not duplicated down here. */
  @media (max-width:820px){
    .fbar-top .brand{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .fbar-top .brand{transition:none}
  }
  /* The wordmark is a serif at 15px, the rest of the row is 11px sans. Under
     `align-items:baseline` the browser aligns TEXT baselines, but each face
     puts its own descender below the same baseline by a different amount, so
     the visible bottom edge of the wordmark sits lower than the chips' even
     when the baselines agree. That 2.5px is the serif's excess descent at
     this size. Pulling the element up by it makes the printed bottoms agree
     without disturbing the baseline the browser actually computed. */
  .fbar-top .brand b{
    /* The wordmark is the one element in the bar that is allowed to be big.
       It is the name of the paper, set in the display serif at a size that
       reads as a masthead rather than as a label, and it is the thing that
       appears when the masthead itself has scrolled away.

       `line-height:1` is what makes the optical centring exact. The serif sits
       on a baseline with more descent above the cap-height than the sans
       controls have below their own baseline, so at the default `line-height`
       the text's box is taller than the glyphs and the name reads as sitting
       low in the bar. Collapsing the line box to the glyph height removes the
       slack, and `top` centres the remaining box on the row. */
    font-family:"Playfair Display","Playfair Display Fallback",Georgia,serif;
    font-size:22px;font-weight:900;
    letter-spacing:-.02em;text-transform:uppercase;
    line-height:1;
    display:block;
    position:relative;top:-1px;
  }

  /* The search field is a line and a lens, not a box. A full border made it
     the only closed rectangle in a bar that is otherwise all rules and open
     space, so it read as an input from a different site.

     The icon is taken OUT of flow rather than placed first as a flex item.
     Inside a baseline-aligned flex container, the container's own baseline is
     inherited from its first baseline-participating child — and an inline SVG
     is a replaced element, so it contributes its bottom margin edge, not a
     text baseline. The field then aligned itself 2px below the brand and the
     day chips, which is exactly the misalignment this was meant to remove.
     Absolute positioning takes the icon off that calculation, so the wrap's
     baseline is the input's text and `align-items:baseline` on the bar does
     the alignment by construction. The icon is then placed by hand against
     the x-height, which is the only thing that CAN align a circle to text. */
  /* --search-lh and --search-desc are the input's OWN resolved metrics.
     Measured in-browser at the shipped font stack (13px/18px): the line box
     is 18px tall and the text baseline sits ~3.5px above its bottom. */
  .fbar-top .search-wrap{
    position:relative;
    --search-lh:18px;
    --search-desc:3.5px;
    /* --lens-centre: how far below this element's content top the LENS CENTRE
       must sit, so the lens reads as level with the placeholder's lowercase
       band rather than floating on the rule.

       Derived from measured font metrics at 13px/18px, then verified against
       the rendered page: the placeholder's baseline sits 16.5px below the
       input's top, the font's ascent is 9px, so the middle of the x-height
       band is 16.5 - (0.55 x 9) = 11.55px down; subtracting the icon's own
       half-height (6.5px) puts the icon's top edge at 5px.

       It is a constant because the font, the size and the line-height are all
       fixed here. test-header.cjs asserts the rendered result, so a change
       that invalidates it fails loudly rather than drifting a few pixels. The
       two variables it replaced (--baseline-to-bottom, --cap-lift) could not
       be reasoned about by eye from a `bottom` offset — see the note on
       .s-ico — and this single measured anchor replaces both. */
    --lens-centre:5px;
    flex:1 1 220px;min-width:150px;max-width:400px;
    border-bottom:1px solid var(--rule);
    padding-bottom:3px;
  }
  /* The focus indicator lives on the WRAPPER, not on the input.
     `input[type=search]` is borderless by design (see the rule below), so the
     browser's own focus ring is suppressed on it and the wrapper has to carry
     the indicator instead — otherwise keyboard focus on the search field is
     completely invisible.

     This rule previously only re-declared `border-bottom-color:var(--ink)`,
     which was a NO-OP: the wrapper's border is already `var(--ink)` at rest, so
     nothing changed between focused and unfocused. Measured with focus held:
     `outline` computed to `3px none`, `box-shadow` to `none`, and the bottom
     border to the identical `rgb(10,10,10)` in both states — a WCAG 2.4.7
     failure that a screenshot cannot reveal, because a focused search field and
     an unfocused one are pixel-identical.

     The 2px ring matches every other focusable on the page (`.chip`,
     `.ftoggle`, `.skip`, `.only-free`), so keyboard focus reads the same
     everywhere. */
  .fbar-top .search-wrap:has(:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  .fbar-top .search-wrap:focus-within{border-bottom-color:var(--ink)}
  /* Bottom-anchored, not top-anchored. `top` on an absolutely positioned
     child is measured from the wrap's padding box, and that box's height
     depends on the input's corrected margin — so a top-anchored icon lands
     somewhere different every time the metrics are retuned. Measuring up from
     the rule ties the icon to the one edge in this element that does not
     move. */
  .fbar-top .s-ico{
    position:absolute;left:0;width:13px;height:13px;color:var(--ink-3);
    /* Positioned from `top`, not `bottom`.
       `bottom` on an absolutely positioned box is measured from the
       containing block's PADDING box, which here is the input's own corrected
       box — and that box's height changes with the metrics below. Two earlier
       attempts to express the placement as `bottom: baseline - lift - half`
       both landed the lens at the rule, because the baseline-to-edge distance
       and the icon's half-height are the same order of magnitude and the
       arithmetic cannot be done by eye.

       Anchored from the top instead, with the one quantity that is genuinely
       stable: the offset from this element's content top down to the centre of
       the placeholder's lowercase band. That is 11px, measured on the
       rendered page, and it does not depend on where the rule or the descender
       happen to sit. */
    top:var(--lens-centre, 11px);
  }
  .fbar-top .search-wrap:focus-within .s-ico{color:var(--ink)}
  .fbar-top input[type=search]{
    width:100%;min-width:0;
    /* The shared `select,input[type=search]` rule above gives every field a
       1px border; this one is borderless by design, and it must also drop
       the UA's own padding and indent the text past the absolute icon. */
    border:0;padding:0 0 0 20px;background:transparent;
    font:inherit;font-size:13px;line-height:var(--search-lh, 18px);color:var(--ink);
    /* Chrome treats an <input> as an ATOMIC inline: in a baseline-aligned flex
       row it aligns by its bottom MARGIN edge, not by the baseline of the text
       inside it. Uncorrected, the placeholder and the lens sat the font's
       descent (~3.5px) ABOVE the brand and the buttons — which is why the row
       read as unaligned even with `align-items:baseline` set correctly.

       A positive bottom margin equal to that descent makes the two coincide:
       the margin edge (what flex aligns) is pushed down by exactly the space
       between the text baseline and the box bottom, so the text baseline lands
       on the shared baseline. A NEGATIVE margin, or compensating
       padding-bottom, moves the text the wrong way — that was tried first and
       pushed the field 13px below its neighbours. */
    margin-bottom:var(--search-desc, 3.5px);
  }
  .fbar-top input[type=search]::placeholder{color:var(--ink-3);opacity:1}
  .fbar-top input[type=search]:focus-visible{outline:none}
  /* Chrome's built-in clear button is a hard-edged glyph in the wrong face. */
  .fbar-top input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

  .fbar-top .day-pickers{display:flex;gap:4px;flex:0 0 auto;flex-wrap:nowrap;min-width:0}
  .fbar-top .day-pickers .chips{flex-wrap:nowrap;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:1px}
  .fbar-top .day-pickers .chip{font-size:11px;padding:5px 9px;flex:0 0 auto}

  /* The count is a reading, not a control: it sits with the day chips, to
     their right, in the serif the masthead uses. `align-items:flex-end` on
     .right used to align it against the baseline of a 26px number, which is
     why it floated low against an 11px button. */
  /* The slack in the bar is absorbed BEFORE the count, and in ONE place only.
     Both `.count` and `.right` used to carry `margin-left:auto`, which split
     the free space between them: the count drifted 42px away from ONLY FREE
     and the group did not read as one cluster. The auto margin now lives
     solely on `.count`, which is the first of the three right-hand items, so
     everything from the count rightwards is packed by the bar's own `gap` and
     FILTERS lands exactly on the bar's content edge. */
  .fbar-top .count{
    flex:0 0 auto;margin-left:auto;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    font-family:"Playfair Display","Playfair Display Fallback",serif;font-size:19px;font-weight:700;
    line-height:1;white-space:nowrap;
  }
  .fbar-top .count small{
    font-family:Archivo,"Archivo Fallback",sans-serif;font-size:9px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:0;
  }

  /* ONLY FREE and FILTERS are one control pair, so they are one control:
     identical box metrics, both baseline-aligned in the bar, ONLY FREE
     immediately left of FILTERS. Only Free was 6px/10px at weight 600 against
     Filters' 7px/11px at 700, so the two read as different sizes — the
     letter-spacing is the tell, and matched to Filters makes the pair
     deliberate. */
  .fbar-top .only-free{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-2);
    background:transparent;border:1px solid var(--rule);padding:7px 11px;
  }
  /* Above phone width Only Free is the LAST control, right of Filters; Clear
     filters stays directly left of Filters. `order` rather than a markup move so
     the phone layout (Only Free left, Filters right, own row) is untouched — the
     <=720px block sets its own orders and wins by source order. */
  .fbar-top .only-free{order:5}
  .fbar-top .only-free input{position:absolute;opacity:0;width:0;height:0}
  .fbar-top .only-free.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}
  .fbar-top .only-free:has(:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

  /* The slack in the bar is absorbed BEFORE the right-hand cluster, and in ONE
     place only.

     `.count` used to be that element and it used to carry the `margin-left:auto`
     here. It is gone from the markup — the "XXX Events" readout was removed from
     the bar — but this rule was left behind, and with nothing left to carry it
     the row's free space had no owner. The result was a 100px hole sitting
     between ONLY FREE and FILTERS: the two controls that are supposed to read
     as one cluster were pushed apart by dead space that nothing accounted for.

     `.right` is now the element that takes the slack, because it is the last
     item in the row and pushing it to the content edge is what puts FILTERS
     against the right margin. Both it and `.count` must never carry an auto
     margin at once: two of them split the free space between them and the
     cluster drifts apart again. */
  .fbar-top .right{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-left:auto}
  .fbar-top .ftoggle{margin-left:0}
  .ftoggle{
    display:inline-flex;align-items:center;gap:7px;font:inherit;cursor:pointer;
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;color:var(--ink);border:1px solid var(--rule);padding:7px 11px;
  }
  .ftoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ftoggle .caret{
    width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;
    border-top:5px solid currentColor;transition:transform .16s;
  }
  .ftoggle[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .ftoggle{position:relative}
  /* The count rides the button's top-right corner instead of sitting inline:
     an inline badge that is merely hidden still reserves its width, which left
     a blank gap between the label and the caret on every state. Out of flow, the
     button is exactly label + caret, and the count can appear without moving
     anything. */
  .ftoggle-n{
    position:absolute;top:-8px;right:-7px;
    min-width:17px;height:17px;padding:0 4px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;letter-spacing:0;font-weight:700;
    background:var(--ink);color:var(--paper);
    box-shadow:0 0 0 2px var(--paper);
    visibility:hidden;
  }
  .ftoggle-n.active{visibility:visible}
  .filters[data-collapsed="true"] .frow{display:none}

  /* The day rail is the mobile stand-in for the Day chip group, which moves
     into the collapsible panel on wide screens. Exactly one copy is ever
     visible, so the chips are built once into #f-day and moved by script. */
  .fday-rail{display:none;flex-direction:column;gap:5px;min-width:0;flex:1 1 auto}
  .fday-rail .chips{overflow-x:auto;-webkit-overflow-scrolling:touch;
    flex-wrap:nowrap;padding-bottom:2px}
  .fday-rail .chips .chip{flex:0 0 auto}
  .fgroup{display:flex;flex-direction:column;gap:5px;min-width:0;align-self:start}
  .flabel{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}

  .chip{
    font:inherit;font-size:12px;font-weight:500;line-height:1;
    padding:6px 10px;border:1px solid var(--rule);background:transparent;color:var(--ink);
    /* radius lives in the single ".chip, .tag { border-radius:2px }" rule
       further down — this used to also declare 1px here, dead on arrival
       since the later, same-specificity rule always won; one definition. */
    cursor:pointer;white-space:nowrap;
    transition:background .12s,color .12s;
  }
  .chip:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  /* Empty, not gone: see chipRow(). Dimmed and inert, still occupying its slot. */
  .chip:disabled{opacity:.38;cursor:default}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip .n{opacity:.55;font-size:11px;margin-left:5px;display:inline-block;text-align:right;font-variant-numeric:tabular-nums}

  select,input[type=search]{
    font:inherit;font-size:13px;padding:6px 8px;
    border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:0;
  }
  select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input[type=search]{min-width:190px}

  .right{margin-left:auto;display:flex;align-items:flex-end;gap:16px}
  .count{font-family:"Playfair Display","Playfair Display Fallback",serif;font-size:26px;font-weight:700;line-height:1;white-space:nowrap}
  .count small{display:block;font-family:Archivo,"Archivo Fallback",sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}

  .reset{font:inherit;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    background:none;border:none;border-bottom:1px solid var(--ink);color:var(--ink);cursor:pointer;padding:2px 0;
    visibility:hidden}
  .reset:hover{color:var(--accent);border-color:var(--accent)}
  /* Reserved, not removed: [hidden]/display:none would let Filters (and
     everything left of it) slide over to fill the gap the moment a filter
     clears, which is exactly the kind of jump this whole pass is trying to
     stop. visibility:hidden keeps the box — and the space directly left of
     Filters — in the row at all times. */
  .reset.active{visibility:visible}

  /* ---------- day section ---------- */
    /* A hard stop between days. The rule is the thickest on the page, it runs
       the full measure, and the day name above it is set in caps at display
       scale — so the break is unmistakable and does not depend on the
       masonry below it. */
    .day{border-bottom:0;padding:30px 0 10px}
    .day:first-of-type{padding-top:14px}
    /* It is an <h2> for the heading outline, so the UA's 1.5em/1.2/margin reset
       must be cancelled or the sticky bar's height changes. */
    .day-head{
      font-size:inherit;font-weight:inherit;margin:0;
      position:sticky;top:var(--barh,64px);z-index:20;
      display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
      background:var(--paper);
      /* The hard line. 2px of --ink, not a hairline: this is the rule that
         separates one day from the next and it should read as a printed
         section break, not as a border between two rows. */
      border-bottom:2px solid var(--ink);
      padding:8px 0 10px;margin-bottom:6px;
    }
    /* ALL CAPS, and the sans face the rest of the page's small labels use, so
       the day break is the same register as the filter bar and the count. The
       serif display face is reserved for the event titles themselves. */
    .day-name{position:relative;font-family:Archivo,"Archivo Fallback",sans-serif;font-size:26px;font-weight:800;letter-spacing:.04em;line-height:1;text-transform:uppercase}
    /* "TODAY" is a small label stacked directly above the day name, left-aligned
       to it. It is positioned out of flow (bottom:100% of the day name) so it can
       never disturb the baseline the date and count align to; only the header's
       top padding grows to make room, and only on the header that carries it.
       On the pink paper --ink-3 is only 3.4:1 at this size, so that theme uses
       --ink-2 (still visibly lighter than the --ink day name). */
    .day-name .today{position:absolute;left:0;bottom:100%;margin-bottom:3px;font-size:10px;line-height:1;font-weight:700;letter-spacing:.16em;color:var(--ink-3);white-space:nowrap}
    .day-head.has-today{padding-top:17px}
    html[data-theme="pink"] .day-name .today{color:var(--ink-2)}
    .day-date{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .day-n{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  /* The F&F monogram: the masthead wordmark's own face (Playfair Display 900,
     same ampersand) set small. Phone only — see the <=720px block. Decorative,
     so it is hidden from assistive tech; the listing count it replaces stays. */
  .day-logo{display:none}

  /* ---------- the listing row ---------- */
  /* The row is a 3-column grid: time gutter, price, then the body.
     It used to be `104px 1fr` with the price folded into the time column. The
     price is now its own element (see the card builder), and a grid with two
     columns silently places the third child on an implicit new row — the badge
     would drop below the time, which is exactly where it used to live, so the
     change would have looked like nothing happened.

     The price column is `auto`, sized to the badge, and its content is pushed
     right so a "FREE" badge and a "$145" badge both end flush at the card's
     right edge. The body takes the remaining 1fr.

     `.price{margin-left:auto}` below is therefore dead for the grid case —
     a margin on a grid item does not push it within its track. The alignment
     that matters is `justify-self:end` here. The margin is kept only for the
     narrow-screen fallback where .row becomes a single column. */
  .row{
    display:grid;
    /* time gutter | body | price. The price is the LAST track so it can sit
       flush against the card's right edge; an `auto` track in the middle holds
       the badge to the width of the badge and leaves the body on the far right,
       which is backwards — the body is the long text and needs the 1fr.

       The children are PLACED explicitly rather than left to fill the tracks in
       DOM order. The builder appends time, price, body — price second — so
       auto-placement put the badge in the 1fr track and left the body in the
       rightmost `auto` one, which is why the badge sat 658px from the card's
       right edge between the 720px and 900px breakpoints: that band matches
       neither the phone rule nor the desktop flex rule, so only this base
       template applied, and it disagreed with both. Explicit `grid-column`
       makes the placement independent of append order, so the three
       breakpoints can share one template and still disagree about nothing. */
    grid-template-columns:104px 1fr auto;
    gap:0 22px;
    padding:15px 0;
    border-bottom:1px solid var(--hair-2);
  }
  .row>.time-col{grid-column:1;grid-row:1}
  .row>.price{grid-column:3;grid-row:1;justify-self:end;align-self:start;margin-left:0}
  .row>*:not(.time-col):not(.price){grid-column:2;grid-row:1}
  .row:last-child{border-bottom:none}
  /* No background tint on hover: the card is not a highlight target. (The photo
     reveal and title underline below are the hover affordances.) */

  /* Time column: the start time, on one line, left-aligned.
     It used to be a flex COLUMN holding the time and the price badge beneath
     it, separated by `gap`. The price is now its own grid child at the card's
     top-right, so the column has a single child — but the column layout and
     its gap stayed, which made the cell as tall as two stacked lines and
     pushed the price badge 24px down. A one-item column should just be the
     item; `display:block` removes the phantom second line entirely, so the
     grid row's height is the time's own line box and `align-self:start` on the
     badge lines the two up for free.

     `.time-col.allday` keeps the class for the italic styling below; it no
     longer needs a gap override because there is nothing to separate. */
  .time-col{display:block;align-self:start}
  /* The time is wayfinding, not a headline. It used to be Playfair 20/700 —
     the same face, size and weight as the 21px title beside it, so the two
     competed and the row read as two headings. Moving the time to the sans and
     dropping it to 15px restores the hierarchy: serif says "what", sans says
     "when". Tabular figures keep the column optically even. */
  .time{font-family:Archivo,"Archivo Fallback",sans-serif;font-size:15px;font-weight:700;line-height:1.2;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  /* The AM/PM sits in the same flex row as the FREE/TICKETED badge and the
     tag chips, so it has to share their baseline. `display:block` with a
     margin-top put it on its own line above them — the three were not
     vertically aligned with each other, which is what the reader notices
     first. `display:inline` + `vertical-align:middle` puts it on the row's
     own baseline, and the letter-spacing is halved at 9.5px so it reads as
     a label rather than a caption. */
  /* The AM/PM mark must sit on the SAME baseline as the price badge beside it.
   These were three independent inline/flex items in a column, each aligning to
   a different box edge, so "PM" floated against the top of the time and the
   $ badge hung off the middle. The fix is one flex line with an explicit
   baseline alignment: every item in it shares the row's baseline, so the
   descender of "PM" and the cap-height of "$24" line up by construction rather
   than by luck. `align-items:baseline` is what does the work; the old
   `vertical-align:middle` on .mer is what broke it. */
.time-col .time{
    display:flex;
    align-items:baseline;
    /* The gap is ZERO. The spaces in the text do the separating: "9 AM — 2 AM"
       carries a real space either side of the em dash, and the meridiem is a
       flex child so it needs no gap of its own. A `gap` here applied to EVERY
       pair of children — number/meridiem, meridiem/dash, dash/next-number — and
       combined with the literal spaces it pushed AM/PM too far from the number
       it belongs to. One mechanism, not two. */
    gap:0;
    white-space:nowrap;
  }
  .time-col .price{
    /* A bordered badge reports its baseline from its text, so on a shared
       flex baseline it needs no correction at all. An earlier version nudged
       it with `transform:translateY(-1px)` on the theory that a box needed
       pulling down by half its own height — it did not, and the nudge is what
       made the two baselines disagree. Removed deliberately. */
  }
  /* The price no longer lives in the time column: it is a flex child of .row
     that packs to the card's right edge via the single `margin-left:auto` on
     `.price` below. This rule used to carry that margin itself and fought the
     badge rule for it — one of the two always lost, depending on source
     order. */
  /* The meridiem carries its own leading space as a margin, not as a space
     character in a sibling text node.

     `.time` is a flex container, and a text node is an anonymous flex item: its
     trailing space is painted but its leading space is trimmed at the item
     boundary, and the browser gives the anonymous box the whitespace-adjusted
     width. So a literal "9 " followed by a <span>AM</span> produced a gap that
     depended on how the flex engine measured that space — measured at 3px here,
     but it is not a value that survives a font fallback or a zoom change, and
     the space before the em dash collapsed to nothing for the same reason.

     `margin-left` on the meridiem is the one mechanism that always works: it
     is not whitespace, so nothing can trim it, and it sits in the same
     transition-free, zoom-stable place the badge occupies. */
  .time .mer{
    display:inline;font-size:9.5px;font-weight:600;letter-spacing:.06em;
    color:var(--ink-3);font-family:Archivo,"Archivo Fallback",sans-serif;
    margin-left:.28em;
  }
  /* The range separator carries its air as margins, for the same reason the
     meridiem does: `.time` is a flex container, and a literal space at the edge
     of an anonymous flex item is trimmed away by layout. A margin is not
     whitespace, so it cannot be trimmed. `aria-hidden` on the element in the
     markup keeps a screen reader from announcing a dash as a character; the
     range is already conveyed by the two times themselves. */
  .time .dash{margin:0 .32em;font-weight:400;color:var(--ink-2)}
  /* `allday` now lives on the COLUMN, since the time element is only the
     time itself — the old `.time.allday` selector matched nothing. */
  .time-col.allday .time{font-size:14px;font-style:italic;font-weight:400;color:var(--ink-2)}
  /* An empty price cell must not push the time's optical baseline around. */
  .time-price:empty{display:none}

  /* An underline in a link should sit under the baseline, not through the
     descenders, and should be interrupted by them. `text-underline-offset`
     and `text-decoration-thickness` get the first two; `text-decoration-skip-
     ink: auto` gets the third, and is what separates a considered underline
     from the browser default. The resting state is hairline and quiet, so a
     listing does not read as a wall of links. */
  /* No underline at rest. The brief asks for underlines on hover only, and a
     hairline underline under all 96 titles read as a wall of links rather than
     a newspaper. The hover state is kept: same thickness and offset, so the
     affordance appears where the eye already expects it. */
  .title-e{
    font-family:"Playfair Display","Playfair Display Fallback",Georgia,serif;font-size:21px;font-weight:700;line-height:1.22;
    letter-spacing:-.008em;margin:0 0 5px;color:var(--ink);
    text-decoration-line:none;text-decoration-thickness:1px;
    text-underline-offset:.16em;text-decoration-skip-ink:auto;
    text-decoration-color:var(--ink);
  }
  /* The title sits in an <h3> for the document outline, so the UA's
     1.17em/1em/margin block has to be cancelled or every row grows and the
     5px gap under the title becomes a 25px one. */
  .row-title{font-size:inherit;font-weight:inherit;margin:0;line-height:inherit}
  /* The resting state is `text-decoration-line:none`, so a hover rule that only
     sets `text-decoration-color` cannot bring the underline back — colour alone
     paints nothing. The line itself has to be re-declared on hover, or the
     affordance is silently dead. */
  .title-e:hover,.row:hover .title-e{text-decoration-line:underline;text-decoration-color:var(--ink)}
  /* The price badge: the card's top-right corner, right-aligned.
     It used to be two separate rules — a bare `.price{margin-left:auto}` that
     assumed it lived inside the time column, and the badge's own appearance
     further down. Split across two blocks they contradicted each other on the
     one property that decided the layout, and neither matched the element as
     it is actually built: a flex child of .row, sitting between the time
     column and the body.

     `margin-left:auto` on that flex child is what pushes it to the right edge,
     and it needs nothing else — no absolute positioning, no float. The badge
     keeps its own border and box, because a price in a box reads as a ticket
     at a glance, where bare text reads as part of the address.

     The `margin-left:auto` below is for the FLEX fallback only (the narrow-screen
     single-column row). On the wide grid it is cancelled by `.row>.price`,
     because a margin does not push a grid item within its track — there
     `justify-self:end` is what right-aligns it. */
  .price{
    margin-left:auto;
    font-family:Archivo,"Archivo Fallback",Helvetica,Arial,sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
    border:1px solid var(--ink);padding:2px 6px;white-space:nowrap;
    align-self:flex-start;
  }
  .price.free{background:var(--ink);color:var(--paper)}

  /* Venue and category are filter affordances, so they are buttons: clicking
     either loads that filter. The event title stays the only outbound link.

     The venue is NOT a chip. It was wearing .price's border-and-shading
     treatment, so a row read as a row of badges with the venue lost among the
     tags. A venue is a place, printed as bold prose in the meta line, with the
     click affordance carried by the underline on hover only. */
  .venue,.tag{cursor:pointer}
  /* There is no global button reset in this stylesheet, so a bare <button>
     keeps the UA's border, grey fill and padding — which is exactly the chip
     look the venue was never meant to have. Reset the box, not the semantics:
     the element stays a button so it stays keyboard-reachable. */
  .venue{
    /* 700, not 500: the venue is the one piece of metadata that must survive a
       glance, and the brief asks for it to be always bold. `--ink-2` is kept
       rather than `--ink` so a bold weight at small size does not out-shout the
       21px serif title beside it. */
    font:inherit;font-weight:700;color:var(--ink-2);
    background:none;border:0;padding:0;margin:0;
    text-align:left;font-family:inherit;line-height:inherit;
    -webkit-appearance:none;appearance:none;
  }
  /* Hit area vs visual size. Measured: .venue rendered 17px tall and .tag 19px,
     against WCAG 2.2 SC 2.5.8 Target Size (Minimum) at 24px. These are inline
     controls, so the "inline in a sentence" exception could arguably cover them
     — but they are the ONLY route to filtering, they are buttons rather than
     text links, and on a phone 17px is a miss waiting to happen. So the hit
     area is grown with padding and the SAME amount is taken back out with an
     equal negative margin: the text keeps its exact position and the line
     rhythm is unchanged, and only the invisible target grows. Equal-and-opposite
     is the whole trick — a padding without the matching negative margin would
     push the line box taller and change the spacing of every row on the page.
     Verified by measurement below, not by inspection. */
  .venue,.tag{
    /* MEASURED, not assumed. Before: .venue 17px, .tag 19px (the tag carries a
       1px border on each side, so it starts 2px taller). Target 24px.
         .venue needs +7px -> padding 3.5px top and bottom.
         .tag   needs +5px -> padding 2.5px top and bottom.
       A single shared value cannot satisfy both, and picking one leaves the
       other short — which is what the first attempt did: .venue hit 24px and
       .tag was still 19px, with 135 controls under target. So the padding is
       per class, sized from the measurement.

       The negative margin cancels the padding so the LINE BOX does not grow;
       that is what keeps every row's rhythm identical. Measured: page height
       unchanged to the pixel, and no title moved. */
    box-sizing:content-box;
  }
  .venue{padding:3.5px 4px;margin:-3.5px -4px}
  .venue:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink);
    text-underline-offset:3px;text-decoration-thickness:1px}
  .tag{
      font-family:Archivo,"Archivo Fallback",Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;
      letter-spacing:.1em;text-transform:uppercase;
      border:1px solid var(--hair);color:var(--ink-3);
      background:transparent;white-space:nowrap;font-family:inherit;
      /* One box for all of it. The hit-area padding lives HERE, in the rule that
         already owned this element's box. A separate `.tag{padding:…}` above was
         dead on arrival: same specificity, later in the file, so this line won
         every time and .tag stayed at 19px while .venue went to 24. */
      /* The tag's content is 11px (14.5px of text minus 2px of border), measured
         rather than assumed — which is why the first attempt at 3.5px padding
         produced 18px, not 24. 11 + 2 + 10 = 23, which rounds DOWN to 23, so
         10px of padding is one short: 11px total is needed.

         The NEGATIVE margin is a hit-area expansion: it grows the click target
         past the visible border so the tag is not a 24px-tall strip of pixels.
         But it was applied on all four sides, and the horizontal half is wrong:
         it pulls the chip's BORDER 4px left of the text column, so every tag on
         every card hangs outside the alignment the time and title set. That is a
         4px optical offset applied to the thing the eye uses to judge the
         margin, which is worse than a slightly small target.

         So the margin is VERTICAL only. The click target keeps its extra height —
         which is the side that needed it, since the padding is 5.5px top and
         bottom against a 10px cap height — and the chip's left edge lands on the
         same x as the time, the title and the description. */
      padding:5.5px 4px;margin:-5.5px 0;
    }
  .tag:hover{border-color:var(--ink);color:var(--ink)}
  .tag:focus-visible,.venue:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tag.gone{color:var(--paper);border-color:var(--ink);background:var(--ink)}

  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--ink-2)}
  /* The per-card provenance word (.prov — "VENUE SITE" / "BOX OFFICE" /
     "LISTING") has been removed at the reader's request; the rule that styled
     it went with it. The three tiers are still fully represented and still
     filterable — they live in the "Link goes to" chip row with live counts —
     they are simply no longer printed beside every venue name. Kept here as a
     one-line note so the next person to grep for `.prov` finds the decision and
     its reasoning rather than assuming the class was never there. */
  .desc{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.5;max-width:74ch;text-wrap:pretty}
  /* A sold-out row stays legible but visibly recedes: it is information, not
     an invitation, and the tag is the only thing that says so. */
  .row.sold .title-e{color:var(--ink-3)}
  .row.sold .title-e:hover{color:var(--ink)}

  .empty{padding:60px 0 80px;text-align:center;color:var(--ink-3)}
  .empty p{font-family:"Playfair Display","Playfair Display Fallback",serif;font-size:22px;margin:0 0 6px;color:var(--ink)}

  /* ---------- footer ---------- */
  footer{border-top:3px double var(--rule);margin-top:34px;padding:20px 0 46px;font-size:12px;color:var(--ink-3)}
  footer .wrap{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
  footer b{color:var(--ink);font-weight:600}
  .err{background:var(--ink);color:var(--paper);padding:14px 18px;font-size:13px;margin:0 0 20px}

  @media (max-width:720px){
    .wrap{padding:0 16px}
    /* Narrow screens keep the time as a left gutter, so the price must be the
       grid's LAST column and the body the one that absorbs the rest. The
       template is `time | body | price` here — reversed from the wide layout —
       because a price on the left of the body would put cost in the most
       expensive real estate on the card.

       This is why the badge sat 254px from the right edge at 390px: with
       `time | price | body`, the badge occupied the 45px middle track and
       `justify-self:end` aligned it inside THAT track, which ends 237px short
       of the card edge. The columns have to be in the order the eye reads
       them — time, then what the event is, then what it costs. */
    .row{grid-template-columns:64px 1fr auto;gap:12px 12px}
    /* The children are already placed by the base rule above
       (time col 1, body col 2, price col 3), so this breakpoint only narrows
       the gutter and the time. It does NOT re-place anything: an earlier
       version repeated the `grid-column` assignments here, and a duplicate
       three-line block for the same effect is exactly the kind of thing that
       later drifts out of sync with the base rule.

       One thing DOES move: the body drops to row 2. On a wide card the body
       can sit beside the badge because there is room to the left of it, but at
       390px the 1fr column is ~230px wide and a long title runs straight under
       the badge — the two overlapped, because both were placed in row 1. Row 2
       gives the body the card's full width below the time-and-price line,
       which is the only arrangement that is legible on a phone. */
    .row>.time-col{grid-column:1;grid-row:1;font-size:13px}
    .row>.price{grid-column:3;grid-row:1}
    .row>*:not(.time-col):not(.price){grid-column:1 / -1;grid-row:2}
    .title-e{font-size:18px}
    /* Was 17px, which is larger than the new 15px desktop value — the media
       query must scale DOWN, not up. */
    .time{font-size:13px}
    .frow{
      grid-template-columns:1fr;
      grid-template-areas:"type" "hood" "price" "avail" "link" "venue";
      row-gap:14px;
    }
    .right{margin-left:0;justify-content:flex-end;align-items:center}
    input[type=search]{min-width:0;width:100%}
    .fgroup.search{flex:1 1 100%}

    /* The header was measured at 239px on a 390px phone — a quarter of the
       screen spent on a wordmark, a five-line kicker and a subhead before a
       single listing appears. Three changes fix it:
       1. the date range drops to its short form (the day chips carry it);
       2. the standfirst is dropped entirely — the fold should show events;
       3. the masthead's top padding and the kicker's leading shrink. */
    .masthead{padding:14px 0 8px}
    .kicker{gap:4px 12px;margin-bottom:10px;padding-bottom:6px;font-size:10px;letter-spacing:.13em}
    .kicker .range-long{display:none}
    .kicker .range-short{display:inline}
    .title{font-size:clamp(40px,13vw,58px);line-height:.86}
    .standfirst{display:none}
    /* The paper still needs a rule under the masthead, but at half the weight. */
    .masthead{border-bottom-width:2px}

    /* The bar was sticky and grew to the height of every wrapped chip row, so
       on a phone it filled the screen and swallowed the page scroll. Collapse
       it to a rail, and cap the opened panel at half the viewport so the
       listings stay reachable. */
    .filters{position:static}
    /* Matches .wrap's own phone inset. Writing `10px 0` dropped the bar's
       content to the viewport edge while everything above stayed inset. */
    .filters-in{padding:10px 16px}
    /* The panel is out of flow ON DESKTOP only, and it has to be back in flow
       here. On a phone the bar is `position:static` — it scrolls away with the
       page — so an absolutely-positioned panel would resolve against the
       viewport, detach from the bar, and float over the listings with no way
       to scroll it out of the way. A panel that belongs to a bar that is no
       longer fixed has to be part of that bar's height again. */
    .frow{position:static;padding:0;box-shadow:none;border-bottom:0;background:none}
    .fbar-top{flex-wrap:wrap;gap:10px 12px}

    /* Cap the whole bar, not just the chip panel. Capping .frow alone let the
       rail + search row stack on top of a 46vh panel, so the bar still reached
       67% of a phone viewport and opening the filters hid the listings — the
       exact outcome the cap exists to prevent. .filters-in is the bar's inner
       box, so capping it scrolls the overflow and keeps rows on screen. */
    .filters-in{max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .frow{overflow:visible}

    /* On a phone the Day chips live on the rail itself, so the one filter that
       carries the page's premise survives the collapse. */
    .fday-rail{display:flex}
  }
/* ---------- masonry (desktop only) ---------- */
    /* Each day's rows are distributed into independent columns, so a card's
       height varies without leaving a gap beneath it. `column-count` with
       `break-inside:avoid` does this in pure CSS and needs no measurement, so
       it cannot drift out of sync with the DOM the way a JS column-balancer
       can after a filter change.
       Deliberately NOT on mobile: these cards carry a time gutter and a title
       that needs the full measure; a 3-up phone grid is unusable. */
    .day-list{column-gap:34px}
    @media (min-width:900px){ .day-list{column-count:2} }
    @media (min-width:1280px){ .day-list{column-count:3} }

    

  /* ---------- artwork: a real halftone ----------
     Amplitude-modulated, like newsprint: a 45-degree grid of round dots whose
     SIZE follows the photograph's darkness, and which vanish entirely where the
     photograph is white. (The previous screen was one fixed dot size laid over a
     greyscale photo, so a white area still printed a uniform dot grid and the
     page read as a texture, not a halftone.)

     It is built from compositing alone, because the artwork host sends no CORS
     headers and so a <canvas> cannot read the pixels:
       1. the photo, greyscale and very slightly blurred (so a dot's size answers
          to the average tone of its cell, not to single pixels);
       2. a rotated grid of cones — black at each dot centre rising to white —
          SCREENED over it: result = 1 - (1-cone)(1-tone);
       3. a hard threshold (brightness to set the cut, then a huge contrast).
          A pixel is ink only where cone and tone are BOTH dark, so the ink dot
          grows with darkness and no dot survives where tone >= the cut.
     `.ht` is that whole stack on its own paper-coloured, isolated plate, laid
     over the real colour photograph; revealing a card just fades the plate. */
  .figure{margin:0 0 11px;position:relative;overflow:hidden;line-height:0;border-radius:2px;background:var(--paper)}
  .figure img:not([src]){display:none}
  /* The anchor is what the reader clicks, so it has to BE the picture area; it
     wraps only images, so it needs the reset an anchor with text never does
     (it was rendering link-blue with Times metrics). */
  .figure-link{display:block;position:relative;line-height:0;cursor:pointer;color:inherit;text-decoration:none}
  .figure .photo{
    display:block;width:100%;
    /* Match the source crop (h300/w864) so the halftone keeps its aspect. */
    aspect-ratio:864/300;
    object-fit:cover;object-position:50% 50%;   /* crop from the centre, never the top edge */
    border-radius:2px;background:var(--paper);
    transition:transform .18s cubic-bezier(.4,0,.2,1);
  }
  .ht{
    position:absolute;inset:0;isolation:isolate;background:var(--paper);
    /* Coming BACK is instant-visible and fades in; see the revealed states for
       the other direction. */
    transition:opacity .18s cubic-bezier(.4,0,.2,1),visibility 0s;
  }
  .ht .bw{
    position:absolute;inset:0;background:#fff;
    filter:brightness(var(--ht-k)) contrast(var(--ht-K)) invert(var(--ht-inv));
    mix-blend-mode:var(--ht-blend);
  }
  .ht .bw img{
    position:absolute;inset:0;display:block;width:100%;height:100%;
    object-fit:cover;object-position:50% 50%;
    /* greyscale -> LEVELS -> (invert) -> blur. The levels pair is per image
       (--lv-b / --lv-c, set from image-levels.json; 1 and 1 when an image has no
       entry, which is the identity). It stretches the photograph so its darkest
       real tone is black and its lightest real tone is white BEFORE the screen
       sees it — otherwise a dark photograph prints as a few blobs of ink.
       ORDER MATTERS: each filter function clamps to 0..1 before the next runs.
       The pair is brightness THEN contrast because brightness(1/(hi+lo)) keeps
       every tone up to the white point below 1. The reverse order (contrast first)
       clipped every tone above 1-lo to white and then dimmed that white, so a
       light image such as a pale map (black point .4) printed as solid black. */
    filter:grayscale(1) brightness(var(--lv-b,1)) contrast(var(--lv-c,1)) invert(var(--ht-inv)) blur(var(--ht-blur));
  }
  /* The dot grid. Oversized and rotated 45deg about its centre; the figure's
     overflow:hidden crops it. A cone runs from black (dot centre) to white at
     --ht-cone, a little over the half-pitch, so the biggest dots just touch. */
  .ht .bw::after{
    content:"";position:absolute;inset:-150%;transform:rotate(45deg);
    background:radial-gradient(circle at 50% 50%,#000 0,#fff var(--ht-cone));
    background-size:var(--ht-cell) var(--ht-cell);
    mix-blend-mode:screen;
  }
  /* Ink colour. The threshold gives pure black dots (white dots in dark mode);
     this recolours them to the theme's ink without touching the paper. */
  .ht::after{content:"";position:absolute;inset:0;background:var(--ink);mix-blend-mode:var(--ht-tint);pointer-events:none}
  /* The colour halftone. A plain colour copy of the photo, blended over the plate
     with the SAME mode as the ink tint (lighten on light paper, darken on dark),
     so it replaces the ink and never touches the paper: black dots become the
     photograph's own colours, the empty paper stays empty. It is the greyscale
     coming off the halftone, which is why a reveal does it BEFORE the plate
     fades: B&W dots -> colour dots -> colour photograph.
     It must NOT be animated for long: it blends inside the isolated plate, so
     every frame of its opacity re-composites the whole filtered, blended stack,
     whereas the plate's own opacity is one cached texture. So the colour
     switches on in a few frames and the ONLY long animation is the plate fade,
     as it always was. Going back it is already off when the plate returns. */
  .ht .cl{
    position:absolute;inset:0;display:block;width:100%;height:100%;
    object-fit:cover;object-position:50% 50%;
    opacity:0;mix-blend-mode:var(--ht-tint);
    transition:none;
  }

  /* The CARD is the hover target, not just the picture: hovering the time, the
     title, the description or the tags all fade the plate away to the colour
     photograph. */
  .row:hover .ht .cl,
  .figure:hover .ht .cl,
  .figure-link:focus-visible .ht .cl{
    opacity:1;transition:opacity .05s linear;
  }
  .row:hover .ht,
  .figure:hover .ht,
  .figure-link:focus-visible .ht{
    opacity:0;
    /* One fade, as before (.2s), starting a hair after the dots turn colour, so
       what dissolves is already a COLOUR halftone. Once faded, stop painting
       it: ~120 cards each carry a filtered, blended, isolated stack, and a
       hidden one should cost nothing. The visibility flip waits for the fade
       (.03s + .2s). */
    visibility:hidden;transition:opacity .2s cubic-bezier(.4,0,.2,1) .03s,visibility 0s linear .23s;
  }
  .row:hover .photo,
  .figure:hover .photo{transform:scale(1.02)}
  /* The focus ring belongs to the link, drawn on the figure (the crop box) so it
     traces the picture; the photograph itself is aria-hidden and out of the tab
     order — a keyboard reader reaches the event through its title. */
  .figure-link:focus-visible{outline:none}
  .figure:has(.figure-link:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

  /* No blend support: show a plain greyscale photo rather than a broken plate. */
  @supports not (mix-blend-mode:screen){
    .ht{display:none}
    .figure .photo{filter:grayscale(1) contrast(1.2) brightness(1.3)}
    .row:hover .photo,.figure:hover .photo{filter:none}
  }

@media (max-width:899px){
  .figure .photo{aspect-ratio:16/9}
  /* A phone has no hover, so the plate would never fade and the card would stay
     monochrome forever. Each card reveals to full colour as it enters the
     viewport (`.revealed`, added once by the IntersectionObserver in
     `watchFigures()`) and stays revealed. The 500ms timing is touch-only: on a
     pointer device a half-second wash would turn a crisp hover into a lag. */
  .ht{transition:opacity .5s cubic-bezier(.4,0,.2,1),visibility 0s}
  .figure .photo{transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .figure.revealed .ht .cl{opacity:1;transition:opacity .08s linear}
  .figure.revealed .ht{
    opacity:0;
    /* The dots turn colour, then the plate dissolves (.5s, from .04s). A
       revealed card never goes back, so on a phone the plate is dropped from
       painting once the wash ends — the biggest memory saving available where
       it matters most. */
    visibility:hidden;transition:opacity .5s cubic-bezier(.4,0,.2,1) .04s,visibility 0s linear .54s;
  }
}
@media (max-width:899px) and (prefers-reduced-motion:reduce){
  .ht,.ht .cl,.figure .photo,.figure.revealed .ht,.figure.revealed .ht .cl{transition:none}
}

/* The rule between rows has to become a rule BETWEEN cards. In a single
   column it was a bottom border; in a masonry column the same border reads
   as a hanging underline under whichever card happens to end mid-column. */
@media (min-width:900px){
  .day-list .row{
    border-bottom:none;
    border-top:1px solid var(--hair-2);
    padding:16px 0 18px;
    /* No hover tint: a full-bleed background behind a card that occupies
       part of its column reads as a highlight state, which this paper
       does not use. */
    break-inside:avoid;
    page-break-inside:avoid;
  }

  /* The card's TOP LINE holds the time and the price, and the body sits under
     both. Because this block makes `.row` a plain block (the time leaves its
     grid column, and a masonry card is too narrow to keep a 104px gutter),
     the three children stacked as three blocks: time, then price 24px below
     it, then the body. The price was therefore NOT beside the time at any
     width above 900px — it looked right only in the narrow-screen grid.

     `display:flex` with `flex-wrap:wrap` puts the time and the badge on one
     line and lets the body take the next line at full width. The badge takes
     `margin-left:auto` to push itself to the card's right edge, which is the
     flex equivalent of the `justify-self:end` the grid uses below 900px —
     the two rules are deliberately written the same way so the badge lands in
     the same place at every breakpoint. */
  .day-list .row{
    display:flex;flex-wrap:wrap;align-items:baseline;
    column-gap:14px;
  }
  .day-list .row>.time-col{flex:0 0 auto}
  .day-list .row>.price{margin-left:auto;flex:0 0 auto}
  /* The body is the one child that must claim the rest of the card: `flex-basis`
     at 100% plus a zero min-width lets it break to the next line even though it
     would otherwise shrink to fit beside the badge. */
  .day-list .row>*:not(.time-col):not(.price){flex:1 1 100%;min-width:0}

  /* Inside a masonry card the time is a top line, not a left gutter —
     keeping the 104px column would eat a third of a ~350px card. */
  .day-list .time-col{
    display:flex;align-items:baseline;gap:7px;margin-bottom:0;
  }
  /* The badge and the time share the top line, so the badge's 10px type must
     sit on the SAME baseline as the 14px time beside it. A bordered badge
     reports its baseline from its own text, so `align-items:baseline` on the
     flex line aligns them without an offset. */
  .day-list .row>.price{align-self:baseline}
  /* 14px, not 17px: 17px was larger than the 15px desktop time and
     undid the hierarchy fix once this block stopped being print-only. */
  .day-list .time{font-size:14px}
  .day-list .time .mer{display:inline;margin:0 0 0 3px}
}

  /* `break-inside:avoid` keeps a listing off a page break in PRINT. This rule
     was once written without its closing brace, which is not a no-op: the
     unterminated block swallowed everything after it, so the print rule that
     hides the filter bar was never reached and the bar was live on the
     printed page. Total brace count balanced only because other rules
     happened to cancel out. Closed, and kept closed. */
  .row{break-inside:avoid}

    /* The defs-only <svg> is in the BODY (see below), not here. A <svg> element
       written inside a <style> block is not CSS — the parser drops it as an
       unknown token, so `url(#halftone)` resolves to nothing and every photo
       renders unfiltered. It needs to be real markup, in the document, next to
       the images that reference it. */

  @media print{
    .filters{display:none}
  }

/* Price right-aligned on desktop */
@media (min-width:900px) {
  .price {
    margin-left: auto;
  }
}

/* Category chips: the flex row, and the air around it.
   ---------------------------------------------------------------------------
   Three separate spaces live here, and they are not the same value.

   1. AIR ABOVE AND BELOW. `.tags` had a 5px `gap` and no margin at all, so the
      chip row sat flush against the bottom of the description above it:
      measured across six cards, the description's bottom edge and the chips'
      top edge were the same pixel, every time — a real 0px, not a tight-looking
      one. The chips' own negative margin pulled their boxes 5.5px up into that
      boundary, so the visible border of the first chip overlapped the last line
      of body text. That is the collision.

      The margin is on `.tags` rather than on `.desc` so the space belongs to the
      element that needs it, and so a card with no description still keeps its
      chips off the title above.

   2. BETWEEN CHIPS ON ONE LINE. 5px, left alone. The same expansions apply
      horizontally, but each chip carries 4px of horizontal padding, so the
      measured gap between two chips side by side is ~16px. Nothing to solve.

   3. BETWEEN WRAPPED LINES. Not 5px, and this is the one that reads as a bug.

      A flex `gap` is ONE value for both axes, so `gap:5px` gave wrapped chip
      lines the same 5px as the gap between chips on one line. That looks right
      in the stylesheet and is wrong on screen, because the chip's border is not
      its flex item: every `.tag` carries `margin:-5.5px 0` as a hit-area
      expansion, so its visible border sits 5.5px above and 5.5px below the item
      the flex engine is spacing. Two wrapped lines were therefore
      `5 - 5.5 - 5.5 = -6px` apart — their borders crossed by 6px, which is why
      the two rows read as merged into one block.

      Raising the row gap alone cannot fix that: the expansions are 5.5px deep
      on each side, so any row gap under ~11px leaves the borders touching or
      crossing. 14px clears both with a little paper left over, which is the
      smallest value at which two wrapped rows read as separate objects. */
.tags {
  display: flex;
  flex-wrap: wrap;
  column-gap: 5px;
  row-gap: 14px;
  margin: 14px 0 2px;
}

/* Chip and tag corner radius */
.chip, .tag {
  border-radius: 2px;
}


  /* ---------- compact filter bar + narrow header ----------
     Two layouts below the full desktop row, chosen so every row is full and
     aligned instead of wrapping wherever the widths happen to fall.

     <=1140px (tablet / narrow window), two rows — 1140 because the one-row bar
     needs ~1095px (measured: wordmark slot 157 + search 220 + days 310 + Only
     free 99 + Clear/Filters 205 + gaps + margins); below that Filters wrapped
     onto a row of its own:
        [ search ............ | Only free | Clear | Filters ]
        [ All | Wed | Thu | Fri  — full-width segmented row   ]
     <=720px (phone, bar scrolls with the page), three rows:
        [ search, full width ]
        [ All | Wed | Thu | Fri — full-width segmented row ]
        [ Only free ................ Clear | Filters ]
     The controls keep one fixed order and the same sizes at every width; only
     which row they sit on changes. */
  @media (max-width:1140px){
    .fbar-top{gap:10px 14px}
    .fbar-top .search-wrap{max-width:none}
    .fbar-top .day-pickers{order:10;flex:1 1 100%}
    .fbar-top .day-pickers .chips{width:100%}
    .fbar-top .day-pickers .chip{flex:1 1 auto;text-align:center}
  }
  @media (max-width:980px){

    /* Masthead kicker: line 1 is the place and dates, line 2 is the edition stamp
       on the left and the theme switch on the right — both edges aligned, instead
       of the switch sitting loose beside the stamp. */
    .kicker{gap:8px 12px}
    .kicker>span:first-child{flex:1 1 100%}
    .kicker-right{display:flex;flex:1 1 100%;justify-content:space-between;flex-wrap:nowrap;gap:10px}
    #stamp{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .theme span{padding:6px 10px}
    /* The dek is one unbreakable line only while the page is wide enough to hold
       it; below this it ran off the right edge. */
    .standfirst{white-space:normal;text-wrap:balance;max-width:48ch}
  }
  @media (max-width:720px){
    .fbar-top{gap:10px 12px}
    .fbar-top .search-wrap{flex:1 1 100%;min-width:0;
      /* 16px, not 13px: iOS zooms the page on focus of any field under 16px, and
         the zoom never undoes itself. The lens and underline are re-fitted to the
         22px line this makes. */
      --search-lh:22px;--search-desc:0px;--lens-centre:4.5px;padding-bottom:6px}
    .fbar-top input[type=search]{font-size:16px}
    .fbar-top .day-pickers{order:1}
    .fbar-top .only-free{order:2}
    .fbar-top .right{order:3}
    .fbar-top .day-pickers .chip{padding:7px 9px}

    #stamp{letter-spacing:.1em}
    .day-name{font-size:22px}
    /* On a phone the filter bar scrolls away with the page, so once the reader is
       a screen down nothing on it says which paper this is. The sticky day header
       is the one thing that stays, so the monogram rides it, right-aligned where
       the listing count used to sit. The count is visually hidden, not removed:
       "33 listings" is still announced by screen readers. */
    .day-n{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .day-logo{
      display:block;margin-left:auto;
      font-family:"Playfair Display","Playfair Display Fallback",Georgia,serif;font-weight:900;
      font-size:24px;line-height:1;letter-spacing:-.04em;color:var(--ink);
    }
    .day-logo .amp{letter-spacing:-.02em}

    /* Theme switch: three colour swatches instead of three words. Each circle is
       painted in the theme it selects (fixed values, not var()s — a swatch has to
       look the same whichever theme is live). The words stay in the DOM at
       font-size:0, so each radio keeps its accessible name ("Light", "Dark",
       "Pink"). 24px circles meet the WCAG 2.2 minimum target size; the selected
       one gets a ring offset from its edge. */
    .themes{border:0;border-radius:0;overflow:visible;gap:10px;align-items:center}
    .theme+.theme{border-left:0}
    .theme span{
      width:24px;height:24px;padding:0;border-radius:50%;
      font-size:0;letter-spacing:0;
      border:1.5px solid var(--ink-3);
    }
    .themes .theme:nth-child(1) input+span{background:#fbfaf7}
    .themes .theme:nth-child(2) input+span{background:#141414}
    .themes .theme:nth-child(3) input+span{background:#ffaedb}
    .themes .theme input:checked+span{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
    .themes .theme input:focus-visible+span{outline-offset:4px}
  }

  /* ---------- focus rings: keyboard navigation only ----------
     :focus-visible alone is not enough. A TEXT field always matches it, even when
     it was focused by a tap or a click (the spec treats "you are about to type"
     as reason enough), so tapping the search box drew the red ring on every
     phone. The ring is wanted only while someone is navigating by keyboard. The
     script at the foot of the page sets data-input="pointer" on the first mouse,
     touch or pen press and data-input="keyboard" on Tab; until either happens the
     attribute is absent and the native :focus-visible rules above apply
     unchanged, so a screen-reader or switch user who never presses a pointer
     keeps every ring. Typing letters does NOT flip the mode back — only Tab —
     so the ring does not appear mid-search. */
  html[data-input="pointer"] :focus-visible,
  html[data-input="pointer"] .search-wrap:has(:focus-visible),
  html[data-input="pointer"] .only-free:has(:focus-visible),
  html[data-input="pointer"] .figure:has(.figure-link:focus-visible),
  html[data-input="pointer"] .theme input:focus-visible+span{outline:none !important}
</style>
</head>
<body>
<a class="skip" href="#list">Skip to listings</a>

<!-- The halftone SVG filter, rebuilt.
     It was previously removed: the chain was luminance -> alpha, then a
