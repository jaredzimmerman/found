     `discrete` feFuncA with 8 buckets where EVERY table had 0 in bucket 7. A
     dark pixel scores alpha ~= 1, lands in bucket 7, and thresholds to fully
     transparent — so a dark photo lost its entire shadow end and the card
     rendered as a blank rectangle (measured at 637 bytes against 47,945 for
     the same element with the filter off).

     The fix is to invert the luminance BEFORE the alpha conversion, so the
     darkest pixel of the photograph becomes the one that receives the most ink
     rather than the one that gets erased. `values="0 1" -1 0 0 0 0` is that
     inversion. Bucket 7 — the most ink — is now reachable by the shadows, and
     bucket 0 by the highlights, which is the correct direction for a screen.

     Dot radii are deliberately small (0.5–2px). A coarse screen at this
     rendered size (864px source into a ~350px column) reads as noise, not as
     newsprint, and dots above ~2px moire against the rule lines. -->

<header class="masthead">
  <div class="wrap">
    <div class="kicker">
      <span class="place">
        <!-- The city name is the ONLY visible control for switching cities. It
             looks like ordinary kicker text; nothing else on the page hints that
             a second city exists. Clicking it (or Enter/Space on it) opens a
             two-item menu. -->
        <button class="place-btn" id="place-btn" aria-haspopup="true" aria-expanded="false" aria-controls="place-menu"><b id="place-name">San Francisco</b></button>
        <span class="place-menu" id="place-menu" role="menu" hidden>
          <button class="place-opt" role="menuitemradio" data-city="sf" aria-checked="true">San Francisco</button>
          <button class="place-opt" role="menuitemradio" data-city="dc" aria-checked="false">Washington</button>
        </span>
        &middot; <span class="range-long" id="range">Next three days</span><span class="range-short" id="range-s">Next 3 days</span>
      </span>
      <span class="kicker-right">
        <span id="stamp">&nbsp;</span>
        <!-- The theme control is a segmented set of three, not a dropdown: there
               are only three options, all need to be reachable in one click, and
               the selected one has to be visible rather than inferred. Radio
               semantics (real inputs, not aria-pressed buttons) so a screen reader
               announces the current choice and arrow keys move between them. The
               names are literal: "Light", "Dark", "Pink". -->
          <span class="themes" role="radiogroup" aria-label="Colour theme">
            <label class="theme"><input type="radio" name="theme" value="light"><span>Light</span></label>
            <label class="theme"><input type="radio" name="theme" value="dark"><span>Dark</span></label>
            <label class="theme"><input type="radio" name="theme" value="pink"><span>Pink</span></label>
          </span>

          <script>
          // Read any saved preference from localStorage; fall back to the page's default
          // (which is the Light theme defined in :root — data-theme="light" is set
          // on <html> below only after this script runs, to avoid a flash of the wrong
          // theme before the tokens resolve).
          const saved = localStorage.getItem("theme");
          const html = document.documentElement;
          const radios = document.querySelectorAll('input[name="theme"]');

<script>

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function dayLabel(iso) {

  const dt = new Date(Date.UTC(y, m - 1, d));
  return {
    name: DAYS[dt.getUTCDay()],
    date: MONTHS[m - 1].slice(0, 3) + " " + d,
    long: MONTHS[m - 1] + " " + d,

    // the label took a single letter, and "T" is Tuesday, Thursday and Tue of
    // next week, so three different days printed identically. Two letters are
    // unique, but lower-case two-letter abbreviations ("tu 29 – th 1") read as
    // typos, so the day is abbreviated to its conventional three letters and
    // the range stays legible without the full weekday name.
    short: DAYS[dt.getUTCDay()].slice(0, 3) + " " + d,

}

  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());

// what the scraper published.
let HOODS = [];

  /* ---------- city ----------

     switching cannot leave "San Francisco" or "Fog & Found" behind.

     coast fact, and Washington's version of this same page is "Federal &
     Found". Keeping them as one value would have forced the DC masthead to say
     "Fog" or the SF one to say "Federal"; they are genuinely independent.

     in CITIES cannot orphan a reader's saved choice. */

    sf: {
      name: "San Francisco",
      brand: "Fog & Found",
      feed: "events.json",
      tz: "America/Los_Angeles",
    },
    dc: {
      name: "Washington",
      brand: "Federal & Found",
      feed: "dc-events.json",
      tz: "America/New_York",

      // must not select a key that CITIES has no feed for.

    } catch (_) {

    }

  // Every place-name and masthead the page states, resolved at load and on switch.
  // data-city-name marks the place nodes, data-brand marks the masthead nodes;
  // nothing else hard-codes either.
  function applyCityStrings() {
    const c = CITIES[CITY];
    document.title = `${c.brand} — ${c.name}, next three days`;
    const meta = document.querySelector('meta[name="description"]');
    if (meta) {

        "content",

    for (const el of document.querySelectorAll("[data-city-name]")) {
      el.textContent = c.name;
    }
    for (const el of document.querySelectorAll("[data-brand]")) {
      el.textContent = c.brand;
    }

    }

        // fonts.ready and on resize, but a city switch is none of those — so
        // without this the clip slot keeps the OLD name's width. "FEDERAL & FOUND"
        // is 208px against Fog & Found's 155px, and the slot is overflow:hidden, so
        // DC clipped its own masthead to "FEDERAL & FO".
        //
        // It must be DEFERRED. applyCityStrings() also runs at boot, before `const
        // bar` is initialized, and measureBrand() reads `bar` — calling it inline
        // threw "Cannot access 'bar' before initialization" and left the variable
        // empty. A microtask still runs after the module's top-level statements have
        // finished, so `bar` is bound by then.
        if (typeof measureBrand === "function") queueMicrotask(measureBrand);
      }
// The phone-only reveal observer. Held at module scope so `watchFigures()` can
// disconnect the previous one — `render()` rebuilds every figure from scratch
// on each filter change, so without this the old observer keeps observing
// detached nodes and the reveal degrades over a browsing session.
let figureObserver = null;

// ---------------------------------------------------------------- filtering
// An event that has already started is not an option, and the page can sit open
// for hours. The feed is a three-day window, so "past" is decided in the
// BROWSER's own timezone and against the browser's current clock — not the
// server's, and not the feed's build time. A listing drops out on its own once
// its start time is behind us; a midnight rollover is handled by comparing the
// full timestamp, not just the date, so an event that started at 11pm is gone
// at 11:01 and not at midnight.
//
// The gate lives HERE, in the one predicate every count and every render path
// already goes through, so a chip can never promise a number that includes an
// event nobody can still get to. There is deliberately no filter for it: a
// listing that has started is simply not news, the way a sold-out show is not.
// The clock is read fresh on every check rather than captured at load: a page
// left open across an evening should keep losing yesterday's listings as they
// start, not freeze the page at whatever time it happened to be opened. The
// cost is one Date per row on a re-filter, which is nothing.
// e.date/e.startMinutes are PACIFIC wall-clock figures — fetch.mjs computes
// them in America/Los_Angeles (see laTime() there). Comparing them with
// `new Date(y, m-1, d, 0, startMinutes)` interprets those same numbers in
// the VISITOR'S OWN local timezone instead, which is only correct for a
// visitor who happens to be in Pacific time. For anyone east of the Bay a
// Pacific show got marked "passed" hours before it actually started (three
// hours early from the East Coast); for anyone west of it, a show stayed
// listed for hours after it had already begun. laEpoch() below converts the
// Pacific wall-clock fields to the real instant they name, so "has this
// started?" means the same thing regardless of the reader's own clock.
function laEpoch(y, m, d, hh, mm) {
  // Guess the instant by treating the Pacific wall-clock fields as if they
  // were UTC, then look up the real America/Los_Angeles UTC offset AT that
  // guess (correct across the DST boundary because the guess is always
  // within hours of the true instant, so it falls on the same side of any
  // transition). longOffset gives "GMT-07:00" / "GMT-08:00".
  const guess = Date.UTC(y, m - 1, d, hh, mm);
  try {
    const part = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Los_Angeles", timeZoneName: "longOffset",
    }).formatToParts(new Date(guess)).find((p) => p.type === "timeZoneName").value;
    const m2 = part.match(/GMT([+-])(\d{2}):(\d{2})/);
    const offsetMin = (m2[1] === "-" ? -1 : 1) * (Number(m2[2]) * 60 + Number(m2[3]));
    return guess - offsetMin * 60000;
  } catch {
    // longOffset is widely supported, but degrade rather than throw on a
    // browser that lacks it: the old (locally-interpreted) instant is wrong
    // for a non-Pacific visitor, but it is not nothing.
    return new Date(y, m - 1, d, hh, mm, 0, 0).getTime();
  }
}

function hasPassed(e) {
  if (e.startMinutes < 0) return false; // all-day: still ahead of us today
  const [y, m, d] = e.date.split("-").map(Number);
  const start = laEpoch(y, m, d, 0, e.startMinutes);
  return start <= Date.now();
}

// A row whose TITLE says it is not happening is not a listing. This is
// enforced HERE as well as in the scraper, and the duplication is deliberate:
// the scraper is one of several sources and each can invent its own way to
// publish a cancellation, but `visible()` is the single predicate every row
// passes through to reach the page. Filtering in both places means a source
// that starts marking cancellations this afternoon is handled this afternoon,
// not on the next scraper change. The test is identical in both so the two
// never disagree about what a cancellation is.
const CANCELLED = /\b(cancell?ed|postponed|rescheduled)\b/i;
function isCancelled(e) { return CANCELLED.test(e.title || ""); }

// ---------------------------------------------------------------------------
// Feed sanitiser — the last line of defence before anything is printed.
//
// Every field that reaches the page came from a scraped third-party page, and
// a scraper is only ever as correct as the last regex someone wrote against
// one site's markup. When one of them is wrong the failure is VISUAL: the
// live listing had a funcheap card whose "address" was 10,256 characters of
// the Yerba Buena Gardens festival programme, and it blew the card open,
// because `.desc`/`.meta` bound the WIDTH of a line but nothing ever bounded
// the LENGTH of the string, and a 10KB single-line string simply reflows
// forever.
//
// A width bound is not a defence against a bad value — it is what the broken
// value does TO the layout. So the value itself is bounded here, once, at the
// boundary where the feed becomes page content. Fixing the one regex that
// produced today's example fixes today's example; this fixes the next one,
// whichever source it comes from, without needing the bug to be found first.
//
// Three classes are handled, and all three degrade to something readable
// rather than to an empty card or a broken page:
//
//   1. Escaped source syntax that was never unescaped. Funcheap's listing
//      copy is delivered as a JSON string with literal `\n` and `’`
//      sequences, so an address arrived containing "May 14\nAireene & The
//      Itch" — the reader sees `\n`. Decode those, because they are the
//      SOURCE's escaping, not the reader's.
//   2. HTML entities that survived (`&#8217;`, `&amp;`) — decode the ones
//      that are unambiguous.
//   3. A field that is simply too long for its slot. An address is a street
//      address. Anything past a few lines is a scraper failure, so it is
//      cut at a word boundary rather than printed in full.
//
// This is deliberately a total function over the feed: it runs on every row
// and every field whether or not the current regexes are correct, because
// the whole point is to not depend on them being correct.
const FIELD_LIMITS = { title: 160, venue: 120, address: 160, description: 600, timeLabel: 60, priceLabel: 60 };

// Emoji never reach the page.
//
// This is enforced in TWO places on purpose. The fetchers strip at ingest
// (shared.mjs `deemoji`, called from `strip`), which keeps them out of the
// published feed. This is the second gate, at the render boundary, because a
// feed file can be written by something other than our own scraper — a hand
// edit, an older deployment, a source that starts emitting emoji tomorrow. The
// cost of catching it here is that one card shows a description without a pin
// in front of it; the cost of NOT catching it is the paper's voice breaks.
//
// Arrows are excluded deliberately. "→" sits in a pictographic block but carries
// meaning in prose ("U Street → Dupont"), and stripping it turns a route into
// two unrelated place names. ZWJ and the keycap joiner DO go: they hold
// multi-glyph emoji together, so removing the glyphs without them leaves
// invisible characters floating mid-sentence.
const EMOJI_RE =
  /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2B50}\u{3030}\u{303D}\u{203C}\u{2049}\u{2122}\u{2139}\u{24C2}\u{FE0F}\u{20E3}\u{200D}]/gu;

// Text STYLING that arrived as markdown and would otherwise reach the reader as
// literal punctuation — `**Steel Beans:**`, `*only*`. The scraper strips this,
// but a hand-edited feed or a new source can reintroduce it, so the render
// boundary repeats the same rule the pipeline applies.
//
// Paired markers only, and `_` is deliberately NOT a marker: it is far more
// often a word character than an emphasis marker. See destyle() in shared.mjs
// for why an orphaned closer is handled separately.
const DECOR_RE =
  /(?:\*\*|__)(?=\S)([\s\S]*?\S)(?:\*\*|__)|\*(\S(?:[^*]*?\S)?)\*|`([^`]*)`/g;

function destyle(s) {
  return s
    .replace(DECOR_RE, (_, a, b, c) => a ?? b ?? c ?? "")
    // A run of stars standing alone between two tokens — "] ** FREE" — is a
    // separator, not an unpaired opener with content attached.
    .replace(/(?<=[\s\]\)])[*]{1,3}(?=[\s\[])/g, " ")
    .replace(/(?<=[\w)])[*]{1,2}(?=[\s,.;:!?]|$)/g, "")
    .replace(/[*]{1,2}$/g, "")
    .replace(/[*]{1,2}(?<=\s\()/g, "")
    .replace(/`+/g, "")
    .replace(/[ \t]{2,}/g, " ")
    .trim();
}

// U+2605 (★ BLACK STAR) sits inside the 2600–27BF pictograph range but is
// CONTENT, not decoration: it is a film rating and it appears in artist names
// ("Deathgasm 2: Goremageddon (R) ★"). Stripping it because it shares a
// codepoint block with a fire and a party popper loses information. The star is
// pulled out first and put back afterwards, so the range can stay broad enough
// to catch the actual pictographs.
const STAR = "★";
function deemoji(s) {
  // Same shape as deemoji() in shared.mjs, and the separation between the GLYPH
  // filter and the WHITESPACE tidy is load-bearing in both.
  //
  // An earlier version of this folded EMOJI_RE into tidyEmoji, so the outer call
  // re-ran the glyph filter over the rejoined string and ate the star a second
  // time — `deemoji("Deathgasm 2 (R) ★")` returned "Deathgasm 2 (R)" while
  // `destyle()` on the same input kept it. Two filters, one job each:
  // EMOJI_RE removes glyphs, tidyEmoji only tidies what removing them leaves.
  //
  // Segments are NOT trimmed individually: trimming "…(R) " to "…(R)" deletes
  // the space and prints "(R)★". One trim, on the joined result.
  if (!s.includes(STAR)) return tidyEmoji(s.replace(EMOJI_RE, ""));
  return tidyEmoji(
    s.split(STAR).map((part) => tidyEmoji(part.replace(EMOJI_RE, ""), false)).join(STAR)
  );
}

function tidyEmoji(s, doTrim = true) {
  const out = s
    .replace(/[ \t]{2,}/g, " ")
    // An emoji at the end of a clause orphans its punctuation: "believes 👨‍👩‍👧‍👦."
    // becomes "believes ." and the row reads as damaged rather than cleaned.
    .replace(/ +([.,;:!?…])/g, "$1")
    .replace(/(^|\n)[ \t]*[·•—–|,;:]+[ \t]*(?=\n|$)/g, "$1");
  return doTrim ? out.trim() : out;
}

// Undo the source's own escaping. A real newline becomes a real newline; a
// literal backslash-n sequence (two characters in the JSON) becomes one too,
// so the text reads as the prose it always was.
function unsource(s) {
  return String(s)
    // &#8217; / &#x2019; first, so "&amp;#8217;" decodes to a quote rather
    // than to a literal "&#8217;".
    .replace(/&#(x[0-9a-f]+|\d+);/gi, (m, b) => {
      const cp = b[0] === "x" || b[0] === "X" ? parseInt(b.slice(1), 16) : parseInt(b, 10);
      if (!Number.isFinite(cp) || cp < 0x20 || cp > 0x10ffff || (cp >= 0xd800 && cp <= 0xdfff)) return m;
      try { return String.fromCodePoint(cp); } catch { return m; }
    })
    .replace(/&nbsp;/gi, " ").replace(/&amp;/gi, "&").replace(/&quot;/gi, "\"")
    .replace(/&apos;|&#39;/gi, "\\'").replace(/&lt;/gi, "<").replace(/&gt;/gi, ">")
    // Literal \n, \t, \" as they appear after one JSON round-trip.
    .replace(/\\n/g, "\n").replace(/\\t/g, "\t").replace(/\\r/g, "")
    .replace(/\\u([0-9a-f]{4})/gi, (m, h) => {
      const cp = parseInt(h, 16);
      return cp >= 0xd800 && cp <= 0xdfff ? m : String.fromCharCode(cp);
    })
    .replace(/\\(["'\\])/g, "$1");
}

// One field: unescape, normalise whitespace, cap to this field's slot.
//
// Newlines are collapsed to a space in the short fields and KEPT in the
// description, where a paragraph break is meaningful and the card's own
// `white-space` handles it. A title is always one line — a title with a
// newline in it is a malformed title, and letting it wrap makes the time
// column and the title baseline disagree.
function sanitizeField(v, field) {
  if (v == null) return null;
  let s = unsource(v);
  // Unescaping runs FIRST so that an emoji which arrived as `&#128512;` is a
  // real character by the time deemoji() sees it. Doing it the other way round
  // would let a source dodge the filter simply by escaping.
  //
  // destyle() runs next, for the same reason: `**bold**` and `*em*` are
  // literal punctuation on the page, and unescaping cannot fix them because
  // they were never escaped.
  s = deemoji(destyle(s));
  const isProse = field === "description";

  // no more than two in a row, and never a run of spaces.
  s = isProse
    ? s.replace(/[ \t]+/g, " ").replace(/\n{2,}/g, "\n\n").trim()
    : s.replace(/\s+/g, " ").trim();

  if (cap && s.length > cap) {
    const cut = s.slice(0, cap);
    const sp = cut.lastIndexOf(" ");
    s = (sp > cap * 0.6 ? cut.slice(0, sp) : cut).trim() + "…";
  }
  return s;
}

function sanitizeEvent(e) {
  if (!e || typeof e !== "object") return null;
  for (const f of Object.keys(FIELD_LIMITS)) {
    if (e[f] != null) e[f] = sanitizeField(e[f], f);
  }
  // Categories are chips, and a chip that is a sentence breaks the chip row
  // the same way the address broke the meta row — so they get the same cap.
  if (Array.isArray(e.categories)) {
    e.categories = e.categories.map((c) => sanitizeField(c, "category")).filter(Boolean);
  }
  return e;
}

function visible(e) {
    if (hasPassed(e)) return false;
    if (isCancelled(e)) return false;
    if (state.day && e.date !== state.day) return false;
    if (state.type.size && !e.categories.some((c) => state.type.has(c))) return false;
    if (state.price.size && !state.price.has(e.priceTier)) return false;
    if (state.link.size && !state.link.has(e.linkTier || "listing")) return false;
    if (state.hood.size && !state.hood.has(e.neighborhood)) return false;
    if (state.venue && e.venue !== state.venue) return false;
    if (state.onlyFree && e.priceTier !== "free") return false;
    // A sold-out listing is not an option, so it is hidden by default. The
  // toggle turns it back on for someone checking whether returns came back.
  if (state.hideSold && e.soldOut) return false;
  if (state.q) {
    const hay = `${e.title} ${e.venue} ${e.description} ${e.categories.join(" ")} ${e.neighborhood}`.toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w))) return false;
  }
  return true;
}

// A chip's count must answer "how many rows would I see if I clicked this?",
// which means every OTHER active filter still applies. `visible()` is the same
// predicate `render()` uses, so this stays the single definition of what the
// reader can see — but with ONE facet relaxed, because the chip being counted
// is itself that facet's own selection.
//
// The bug this fixes: each count used to test only its own facet plus
// `visibleNow` (sold-out/time only). With "Books" selected, the Mission chip
// still read 21, because all 21 Mission events were counted regardless of
// type. Clicking it emptied the page — a chip promising 21 and delivering 0.
// `skip` is the facet name to leave out of the test.
function visibleExcept(e, skip) {
  switch (skip) {
    case "day":    return visibleWith({ day: null }, e);
    case "type":   return visibleWith({ type: new Set() }, e);
    case "price":  return visibleWith({ price: new Set() }, e);
    case "link":   return visibleWith({ link: new Set() }, e);
    case "hood":   return visibleWith({ hood: new Set() }, e);
    case "venue":  return visibleWith({ venue: null }, e);
    default:       return visible(e);
  }
}

// `visible()` reads the module-level `state` directly, which is why it cannot
// answer the question above. This variant is the same function with `state`
// temporarily overlaid, so there is one implementation of the rules rather than
// a second copy that can drift from the first.
function visibleWith(overlay, e) {
  const saved = {};
  for (const k of Object.keys(overlay)) {
    saved[k] = state[k];
    state[k] = overlay[k];
  }
  let ok;
  try {
    ok = visible(e);
  } finally {
    Object.assign(state, saved);
  }
  return ok;
}

// ---------------------------------------------------------------- chips
// `width` is the digit count of the chip's UNFILTERED total. The count badge is
// pinned to that many `ch` (tabular figures, right-aligned) so "152" -> "7"
// never resizes the chip — chip widths are a function of the data, not of the
// current selection, which is what keeps every chip row (and the day chips and
// search box beside them) exactly where it was as filters come and go.
function chip(label, on, count, width) {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.setAttribute("aria-pressed", String(on));
  b.innerHTML = esc(label) + (count != null
    ? `<span class="n"${width ? ` style="min-width:${width}ch"` : ""}>${count}</span>` : "");
  return b;
}

// Every filter cleared: what a chip WOULD read with nothing else selected. Used
// only to size chips (see chip()), never to label them.
const NO_FILTERS = { day: "", type: new Set(), price: new Set(), link: new Set(), hood: new Set(), venue: "", q: "", onlyFree: false };
const totalWhere = (pred) => String(ALL.filter((e) => pred(e) && visibleWith(NO_FILTERS, e)).length).length;

// A row the sold-out toggle is currently hiding must not be counted by any
// chip. Counting over the raw feed overstated each label by the sold-out rows
// in its own dimension, so the page promised numbers it would not then render.
// The same argument applies to started events, so `hasPassed` is folded in
// here too: a chip that counts a listing render() will not draw is a label the
// page does not honour.
const visibleNow = (e) => !(state.hideSold && e.soldOut) && !hasPassed(e);

// The single entry point for "the filter state changed". Every mutation of
// `state` goes through here, because the day rail and the five chip rows are
// built by two different functions and a handler that refreshes only one of
// them leaves the other promising numbers the list will not deliver — which is
// exactly the bug this replaced: a type click refreshed the chip rows but left
// the day rail on its old counts, so Tuesday and Wednesday were still offered
// for a list that held one event, on a different day.
function applyFilters() {
  rebuildDayChips();
  refreshChips();
  render();
}

// A chip row is rebuilt on every render, so a per-chip closure would go stale.
// One delegated listener per row, and the chip's identity comes from a data
// attribute — never from parsing its own label back out of the text, which
// breaks on any label ending in a digit.
//
// A chip that would yield nothing is noise: it invites a click that empties the
// page. It is dropped — unless it is already selected, in which case removing
// it would make the selection impossible to undo. Counts and visibility come
// from the same predicate, so a chip can never promise a number the list will
// not deliver.
function chipRow(host, values, count, toggle, labels, match) {
  host.textContent = "";
  for (const v of values) {
    const n = count(v);
    const on = toggle.isOn(v);
    const b = chip(labels ? labels[v] : v, on, n, match ? totalWhere((e) => match(e, v)) : 0);
    b.dataset.value = v;
    // A chip that would empty the page stays where it is, dimmed and inert,
    // instead of being removed. Removing it re-flowed every row and the whole
    // panel around whatever was just clicked; a selected chip is never
    // disabled, so the selection can always be undone.
    b.disabled = n === 0 && !on;
    host.append(b);
  }
  if (!host.dataset.wired) {
    host.dataset.wired = "1";
    host.addEventListener("click", (ev) => {
      const b = ev.target.closest(".chip");
      if (!b || !host.contains(b)) return;
      toggle.toggle(b.dataset.value);
      applyFilters();
    });
  }
}

function anyFilter() {
  return state.day || state.type.size || state.price.size || state.link.size || state.hood.size || state.venue || state.q || !state.hideSold;
}

// ---------------------------------------------------------- filter helpers
// The row's venue and category are the same controls as the chips in the bar,
// so they route through the same functions. Without these, a click on a tag
// would filter the list but leave the bar showing nothing selected.

function toggleType(c) {
  state.type.has(c) ? state.type.delete(c) : state.type.add(c);
  applyFilters();
}

function openBar() {
  // A filter chosen from inside a row is invisible in a collapsed panel, so
  // the bar opens and the chip lights up. Otherwise the reader taps a tag,
  // the list changes, and nothing on screen says why.
  if (bar.dataset.collapsed === "true") {
    setCollapsed(false);
    bar.dataset.userSet = "1";
  }
}

function scrollTop() {
  scrollTo({ top: 0, behavior: "smooth" });
}

// Filters live in the URL so a filtered view can be linked or reloaded, and
// so the back button walks out of a filter the reader can see themselves in.
function pushURL() {
    const p = new URLSearchParams();
    if (state.day) p.set("d", state.day);
    if (state.venue) p.set("v", state.venue);
    if (state.q) p.set("q", state.q);
    for (const c of state.type) p.append("t", c);
    for (const c of state.price) p.append("p", c);
    for (const c of state.link) p.append("l", c);
    for (const h of state.hood) p.append("n", h);
    if (!state.hideSold) p.set("sold", "1");
    if (state.onlyFree) p.set("free", "1");
    const s = p.toString();
    history.replaceState(null, "", s ? "?" + s : location.pathname);
  }

function readURL() {
    const p = new URLSearchParams(location.search);
    state.day = p.get("d") || "";
    state.venue = p.get("v") || "";
    state.q = p.get("q") || "";
    state.type = new Set(p.getAll("t"));
    state.price = new Set(p.getAll("p"));
    state.link = new Set(p.getAll("l"));
    state.hood = new Set(p.getAll("n"));
    state.hideSold = !p.has("sold");
    state.onlyFree = p.has("free");
    const q = $("#f-q");
    if (q) q.value = state.q;
    const of = $("#only-free-input");
    if (of) of.checked = state.onlyFree;
    $("#only-free").classList.toggle("on", state.onlyFree);
  }

// How many filters are live. Shown on the collapsed rail so a closed bar still
// admits it is filtering — otherwise a phone reader sees a short list and no
// explanation for it.
function activeCount() {
  return (state.day ? 1 : 0) + state.type.size + state.price.size + state.link.size + state.hood.size +
    (state.venue ? 1 : 0) + (state.q ? 1 : 0) + (state.hideSold ? 0 : 1);
}

// ---------------------------------------------------------------- render
function render() {
  const list = $("#list");
  const rows = ALL.filter(visible);

  // The "N events" readout used to be updated here. It is gone from the bar at
  // the reader's request, and leaving the two writes behind was not a cosmetic
  // leftover: `$("#n")` on a removed node is null, and `.textContent` on null
  // throws, which killed the rest of render() — so the list, the chips and the
  // day counts would all have stopped updating on the first filter change.
  // Every write to an element the reader cannot see has to go with the element.
  $("#reset").classList.toggle("active", anyFilter());
  syncBadge();
  pushURL();

  list.textContent = "";
  if (!rows.length) {
    list.innerHTML = `<div class="empty"><p>Nothing matches those filters.</p>
      <button class="chip" onclick="document.getElementById('reset').click()">Clear them</button></div>`;
    return;
  }

  const byDay = new Map();
  for (const e of rows) {
    if (!byDay.has(e.date)) byDay.set(e.date, []);
    byDay.get(e.date).push(e);
  }

  for (const [date, evs] of byDay) {
    const L = dayLabel(date);
    const sec = document.createElement("section");
    sec.className = "day";

    // The day header was a plain <div>, so the page had exactly ONE heading
    // (the h1) and a screen-reader user could not jump between days at all.
    // It is a flex row of three spans, so it becomes an h2 with the spans kept
    // as children — the sticky positioning and the baseline flex are unchanged.
    const h = document.createElement("h2");
    h.className = "day-head" + (L.today ? " has-today" : "");
    h.innerHTML = `<span class="day-name">${L.today ? '<span class="today">today</span> ' : ""}${esc(L.name)}</span>
      <span class="day-date">${esc(L.date)}</span>
      <span class="day-n">${evs.length} ${evs.length === 1 ? "listing" : "listings"}</span>
      <span class="day-logo" aria-hidden="true">F<span class="amp">&amp;</span>F</span>`;
    sec.append(h);

    // The rows go into their own wrapper: the masonry rules hang off
    // `.day-list`, so the day heading can stay full-width across the columns
    // while the cards below it flow into 2 or 3 of them.
    const listEl = document.createElement("div");
    listEl.className = "day-list";

    for (const e of evs) {
      const row = document.createElement("article");
      // data-id lets a test tie a rendered row back to its feed record, which
      // is the only way to prove a filter kept exactly the right rows.
      row.dataset.id = e.id;
      row.className = "row" + (e.soldOut ? " sold" : "");

      const body = document.createElement("div");

      // Artwork, when the source has it. The halftone filter turns it into black
      // dots on the page's own paper colour, so the image reads as part of the
      // page rather than a photo dropped into it. It is decorative — the title
      // beside it is the real link — so it is not focusable and carries no alt
      // text of its own.
      //
      // NO `loading="lazy"`. The cards sit inside a CSS multi-column masonry
      // layout, and the browser cannot compute a lazy element's position until
      // the columns are laid out — so it never considers the image near the
      // viewport and never requests it. The symptom was 59 of 72 images
      // remaining `complete: false` indefinitely while their HTTP responses
      // came back 200: the request was fine, it was simply never made. The
      // first 13 loaded only because the layout happened to place them at the
      // top of a column. These are 300px-tall cards on a newspaper page, so
      // eager loading is the right trade.
      if (e.image) {
        const fig = document.createElement("div");
        fig.className = "figure";
        // Per-image levels from image-levels.json (see pinkpages-levels on the
        // server). black point `lo`, white point `hi` -> CSS brightness B then
        // contrast C such that lo maps to 0 and hi maps to 1:
        //   brightness(B) then contrast(C) is  C*B*x + (.5 - .5*C)
        //   want  C*B = 1/(hi-lo)  and  .5 - .5*C = -lo/(hi-lo)
        //   =>    C = (hi+lo)/(hi-lo),   B = 1/(hi+lo)
        // (B*hi = hi/(hi+lo) < 1, so nothing below the white point is clamped on
        // the way through.)
        const lv = LEVELS[e.image];
        if (lv && lv.length === 2 && lv[1] > lv[0]) {
          const [lo, hi] = lv;
          fig.style.setProperty("--lv-b", (1 / (hi + lo)).toFixed(3));
          fig.style.setProperty("--lv-c", ((hi + lo) / (hi - lo)).toFixed(3));
        }
        // The photograph is a LINK to the same place as the title, not a
        // click handler. A real anchor is the whole point: it gets focus order,
        // middle-click, cmd-click, the browser's link preview, and the
        // "open in new tab" affordance for free, all of which a div with a
        // click listener silently loses. The href is read from the same
        // `e.url` the title uses, so the two cannot drift apart.
        //
        // The link is inside the figure, not around it: the figure is the crop
        // box, and an anchor wrapping the box would have to carry the
        // `overflow:hidden` and the radius, which puts focus and hover styling
        // on the wrong element.
        fig.innerHTML =
          `<a class="figure-link" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer" ` +
          `tabindex="-1" aria-hidden="true">` +
          `<img class="photo" src="${esc(e.image)}" alt="" decoding="async" ` +
          `onerror="this.closest('.figure')?.remove()">` +
          // The halftone plate: the same URL again (one network fetch, the
          // browser's cache serves the second), pure decoration, so it is
          // hidden from assistive tech. See the CSS "artwork: a real halftone".
          // It carries a third copy, `.cl`, for the colour-halftone beat of the
          // reveal (greyscale comes off the dots before the plate fades).
          `<span class="ht" aria-hidden="true"><span class="bw">` +
          `<img src="${esc(e.image)}" alt="" decoding="async"></span>` +
          `<img class="cl" src="${esc(e.image)}" alt="" decoding="async"></span>` +
          `</a>`;
        body.append(fig);
      }

      // The event name is the only outbound link: it goes to the venue's own
      // page or its box office, per the feed.
      //
      // It is wrapped in an <h3> so the page has a real outline — h1 (masthead)
      // > h2 (day) > h3 (event). With a bare <a> the document had exactly one
      // heading in it, and a screen-reader user had no way to move between the
      // 106 listings. The anchor keeps its own class, so all the type styling
      // and the underline still apply to the link itself.
      const h3 = document.createElement("h3");
      h3.className = "row-title";
      const a = document.createElement("a");
      a.className = "title-e";
      a.href = e.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = e.title;
      h3.append(a);
      body.append(h3);

      // NOTE: the per-card provenance word ("VENUE SITE" / "BOX OFFICE" /
      // "LISTING") that used to sit here beside the venue is GONE by request.
      //
      // It was not decoration. The feed has three honest tiers — `venue` is the
      // venue or organizer, `boxoffice` their official seller, `listing` the
      // calendar's own page — and the tier was once ONLY a filter facet, so a
      // fallback row was set in exactly the same type as a venue's own site and
      // a reader could not tell them apart (verified at the time: 0 of 40
      // rendered cards mentioned a tier).
      //
      // It went too far the other way. Printed on all 156 cards it spent a
      // third of the meta row saying something true of almost none of them —
      // the large majority ARE venue sites — so the signal was the one thing on
      // the card that could not be trusted to mean anything, and it crowded the
      // venue name and address it sat between.
      //
      // The information is not lost, it is asked for instead: the "Link goes to"
      // filter row still carries all three tiers with live counts, so a reader
      // who cares can surface `listing` in one click and see every fallback at
      // once. That is strictly better than a word on 152 cards that is silent
      // about the 4 that matter.

      // Venue, address and price. Price is deliberately here rather than in
      // the tag row: it is a fact about the ticket, not a category.
      const meta = document.createElement("div");
      meta.className = "meta";
      if (e.venue) {
        // Clicking the venue filters to it — it is an affordance, not a link
        // out. Same affordance as a tag, different axis.
        const v = document.createElement("button");
        v.type = "button";
        v.className = "venue";
        v.textContent = e.venue;
        v.title = `Show everything at ${e.venue}`;
        v.onclick = () => { state.venue = e.venue; applyFilters(); openBar(); scrollTop(); };
        meta.append(v);
      }
      if (e.address) {
        const ad = document.createElement("span");
        ad.textContent = e.address;
        meta.append(ad);
      }
      if (meta.childNodes.length) body.append(meta);

      if (e.description) {
        const d = document.createElement("p");
        d.className = "desc";
        d.textContent = e.description;
        body.append(d);
      }

      // Categories are the second filter axis, and sold-out is a state, not a
      // category — so it stays in the tag row and does not get a filter click.
      const cats = e.categories.filter((c) => c !== "Free");
      if (cats.length || e.soldOut) {
        const tags = document.createElement("div");
        tags.className = "tags";
        for (const c of cats) {
          const t = document.createElement("button");
          t.type = "button";
          t.className = "tag";
          t.textContent = c;
          t.onclick = () => { toggleType(c); openBar(); scrollTop(); };
          tags.append(t);
        }
        if (e.soldOut) {
          const t = document.createElement("span");
          t.className = "tag gone";
          t.textContent = "Sold out";
          tags.append(t);
        }
        body.append(tags);
      }

      const time = document.createElement("div");
      time.className = "time-col" + (e.startMinutes < 0 ? " allday" : "");
      const t = document.createElement("div");
      t.className = "time";
      // Render the time as text, and shrink EVERY meridiem in it — a range has
      // two ("8 PM — 2 AM"), and a single-trailing-match approach would print
      // only one, turning an 8 PM–2 AM show into a false "8 PM – 2 PM".
      // Splitting on every occurrence is the only shape that is correct for
      // both a single time and a range.
      //
      // The source feed writes ranges with two ASCII hyphens ("9 AM -- 10 AM").
      // They are normalised to a real em dash here, spaced, so the time reads
      // the way a listing should. Two hyphens with no spaces is the feed's
      // ASCII fallback, not a typographic choice, and printing it verbatim put
      // "9AM--10AM" on the page.
      // Two normalisations, in this order, and the order matters.
      //
      // 1. The feed writes ranges as "9 AM -- 10 AM" — two ASCII hyphens, the
      //    feed's non-typographic fallback. They become a real em dash with a
      //    space either side. Printing the hyphens verbatim put "9AM--10AM" on
      //    the page, which is not a time anyone can read at a glance.
      //
      // 2. The split below finds a meridiem with `\b(?:AM|PM)\b`, a WORD
      //    boundary. That boundary only exists because of the space in "9 AM" —
      //    between "9" and "A" there is none, because both are word characters.
      //    So the space must still be present when the split runs; it is
      //    removed afterwards, once the meridiem is its own element and the
      //    gap can be a margin in CSS where nothing can collapse it.
      //
      // Doing (2) before the split is the bug this replaces: with the space
      // already gone the pattern matched nothing, every time collapsed to a
      // single text node, and the meridiem silently stopped being smaller and
      // greyer than the hour — a regression that no assertion in the suite
      // was looking for, because "is there an em dash" still passed.
      const rangeFixed = String(e.timeLabel).replace(/\s*-{1,2}\s*/g, " — ");
      // Split on the meridiem, then render the range separator as its OWN
      // element rather than as a space-dash-space run inside a text node.
      //
      // Why: `.time` is `display:flex`, so a bare text node becomes an
      // anonymous flex item, and the browser TRIMS a leading space at that item
      // boundary. "9 AM — 10 AM" therefore rendered as "9 AM— 10 AM": the
      // space before the dash vanished while the space after it survived,
      // because the second one is internal to the same text node rather than at
      // its edge. No amount of fiddling with the string fixes that — the
      // whitespace is being dropped by layout, not by the text.
      //
      // A <span class="dash"> with a margin on each side is whitespace-free, so
      // nothing can trim it, and it survives a font fallback or a zoom the way
      // a literal space does not.
      const chunks = rangeFixed.split(/(\b(?:AM|PM)\b|—)/i);
      for (let i = 0; i < chunks.length; i++) {
        const part = chunks[i];
        if (!part) continue;
        if (/^(AM|PM)$/i.test(part)) {
          const m = document.createElement("span");
          m.className = "mer";
          m.textContent = part.toUpperCase();
          t.append(m);
          continue;
        }
        if (part === "—") {
          const d = document.createElement("span");
          d.className = "dash";
          d.setAttribute("aria-hidden", "true");
          d.textContent = "—";
          t.append(d);
          continue;
        }
        // Collapse whitespace runs, then drop the trailing space if a meridiem
        // or the dash follows — both carry their own margin, so a literal space
        // there would double the gap.
        const next = chunks[i + 1] || "";
        const nextCarriesMargin = /^(AM|PM)$/i.test(next) || next === "—";
        let s = part.replace(/\s+/g, " ");
        // The space is removed on whichever side faces a margin-carrying
        // element. A text chunk can be flanked by margins on both sides — the
        // " " between the dash and "10" is exactly that — and then it is
        // entirely whitespace and is dropped, which is why an empty text node
        // must not be appended at all: an empty anonymous flex item still gets
        // a line box and can nudge the baseline.
        if (nextCarriesMargin) s = s.replace(/ $/, "");
        s = s.replace(/^ /, "");
        if (s) t.append(document.createTextNode(s));
      }
            time.append(t);

      // The price is its own element in the card's TOP line, right-aligned.
      //
      // It used to be built inside `if (e.address)`, so any listing without a
      // street address silently lost its price — which is why the "price in the
      // time column" assertion read 0 of 79 rows. It also lived in the meta row
      // beside venue and address, three facts of different kinds sharing one
      // line, where a right-aligned price could never actually sit right.
      //
      // Price is a fact about the ticket, not the hour or the place, so it gets
      // the card's top-right corner to itself: that is where a reader scanning
      // for cost looks first, and it keeps the time column purely about time.
      // `.time-price` is a flex child of .row with `margin-left:auto`, so it
      // packs to the right edge while the time column stays left-aligned.
      // `:empty{display:none}` keeps a card with no published price from
      // reserving a hole in the top line.
      let priceEl = null;
      const rawPrice = String(e.priceLabel == null ? "" : e.priceLabel).trim();
      // The feed spells the display string `priceLabel`. It was `showPrice`
      // here for a while, which is why this element was gated off for ALL 89
      // events and the price was invisible on the live site while every `.price`
      // rule in this stylesheet sat dead. The two names now have to stay in
      // step, so the field is read defensively rather than trusting either.
      //
      // "None" is a real value in the feed and is NOT a price: 7 events carry
      // the literal string. Printing it would put the word None in a bordered
      // badge in the card's top-right corner. Unknown tier shows no badge at
      // all, and `:empty{display:none}` keeps the hole out of the top line.
      const showPrice =
        e.priceTier === "unknown" || !rawPrice || rawPrice === "None" ? "" : rawPrice;
      if (showPrice) {
        priceEl = document.createElement("div");
        priceEl.className = "time-price price" +
          (e.priceTier === "free" ? " free" : "");
        priceEl.textContent = showPrice;
        priceEl.title = showPrice;
      }
      row.append(time);
      if (priceEl) row.append(priceEl);
      row.append(body);
      listEl.append(row);
    }
    sec.append(listEl);
    list.append(sec);
  }

  // The photographs are re-created from scratch on every render, so any
  // previous observer was left pointing at detached nodes. Disconnect it before
  // wiring a new one, or a long browsing session accumulates observers on DOM
  // that is no longer in the document and the reveal silently stops working.
  watchFigures();
}

// ---------------------------------------------------------------- reveal
// On touch there is no hover, so `.row:hover img` never fires and the halftone
// is the only state the photograph ever has — a phone reader sees a wall of
// screened images with no route to the real picture. This restores it: each
// figure reveals to full colour as it enters the viewport.
function watchFigures() {
  // Only phones are wired up. A pointer device gets the existing hover
  // behaviour, and adding an observer there too would reveal images the
  // pointer has not reached — taking the hover affordance away on desktop.
  if (!matchMedia("(max-width:899px)").matches) return;
  if (!("IntersectionObserver" in window)) return;

  if (figureObserver) figureObserver.disconnect();

  const figures = [...document.querySelectorAll(".figure")];

  figureObserver = new IntersectionObserver(
    (entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        // The class goes on the FIGURE, not the img: the reveal has to take the
        // halftone `::after` with it, and that pseudo-element belongs to the
        // figure. Setting it on the img would fade the colour in while the dot
        // screen stayed put, and the card would resolve twice.
        //
        // `unobserve` makes this one-shot. Without it, scrolling back up fires
        // the non-intersecting branch and the card would grey out again on the
        // way up, which reads as a glitch rather than a reveal. The reader has
        // seen the colour; there is nothing to take back.
        entry.target.classList.add("revealed");
        figureObserver.unobserve(entry.target);
      }
    },
    {
      // The trigger band is the viewport, pulled UP so the transition starts
      // while the card is on screen — never before.
      //
      // `rootMargin` on the BOTTOM axis grows the observer's root DOWNWARD, so
      // the old `0px 0px 15% 0px` began the 500ms wash while the card was still
      // entirely off-screen and finished it before the reader had scrolled near
      // it. The photo simply arrived already in colour, which is exactly what an
      // instant swap looks like. Measured: the class was added with the card's
      // top edge at 1129px in a 1125px viewport — 4px PAST the fold — and 0 of
      // 129 figures were pre-revealed at load, so it was per-card.
      //
      // A NEGATIVE bottom margin pulls the band up instead. -4% of a 1125px
      // viewport is ~45px of lead: the wash has begun but is only ~10% done by
      // the time the card's top edge is genuinely on screen, so the reader is
      // present for most of the 500ms.
      //
      // The value is deliberately small. -10% (~112px) was also on screen and
      // also correct on the trigger check, but it finished so early relative to
      // the fold that a card which stopped just short of the band never
      // revealed at all during a slow scroll — a reveal the reader can scroll
      // past without ever seeing. The band must be close enough to the fold that
      // "entering the viewport" and "entering the band" are nearly the same
      // moment.
      rootMargin: "0px 0px -4% 0px",
      threshold: 0.01,
    }
  );
  figures.forEach((f) => figureObserver.observe(f));
}

// ---------------------------------------------------------------- boot
// Keep the halftone's ink in step with the page's own --ink. The filter is
// static markup, so its colour is fixed at author time; reading the custom
// property here means a change to --ink restyles the artwork too, instead of
// leaving a second, near-black sitting in the filter that drifts from the text.
// The value is normalised to 0–1 because feFunc tableValues are not CSS.
function syncInk() {
  const el = document.documentElement;
  const rgb = getComputedStyle(el).getPropertyValue("--ink").trim();
  const m = rgb.match(/^#([0-9a-f]{6})$/i);
  if (!m) return;                      // not a hex literal: leave it alone
  const n = parseInt(m[1], 16);
  const parts = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => (v / 255).toFixed(3));
  const set = (id, v) => {
    const f = document.getElementById(id);
    if (f) f.setAttribute("tableValues", `${v} 0`);
  };
  set("inkR", parts[0]);
  set("inkG", parts[1]);
  set("inkB", parts[2]);
}
syncInk();
function refreshChips() {
  // Neighborhood chips come from the server's own tally (payload.neighborhoods)
  // rather than a fresh count here. One tally, computed once over the exact set
  // that was published — a second tally in the browser can only drift from it.
  // Fall back to deriving from the rows if the field is absent, so an older
  // feed still renders a working group instead of an empty one.
  const hoodList = HOODS.length
    ? HOODS
    : (() => {
        const c = new Map();
        for (const e of ALL) c.set(e.neighborhood, (c.get(e.neighborhood) || 0) + 1);
        return [...c].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
      })();
  chipRow(
    $("#f-hood"),
    hoodList.map((h) => h.name),
    (h) => ALL.filter((e) => visibleExcept(e, "hood") && e.neighborhood === h).length,
    {
      isOn: (h) => state.hood.has(h),
      toggle: (h) => { state.hood.has(h) ? state.hood.delete(h) : state.hood.add(h); },
    },
    undefined,
    (e, h) => e.neighborhood === h
  );

  chipRow(
    $("#f-type"),
    [...new Set(ALL.flatMap((e) => e.categories))].sort(),
    (c) => ALL.filter((e) => visibleExcept(e, "type") && e.categories.includes(c)).length,
    {
      isOn: (c) => state.type.has(c),
      toggle: (c) => { state.type.has(c) ? state.type.delete(c) : state.type.add(c); },
    },
    undefined,
    (e, c) => e.categories.includes(c)
  );

  // Chip counts must be the number of rows the reader will SEE, not the size
  // of the underlying partition. Counting over ALL overstated every chip by the
  // sold-out rows in its own dimension: "Box office 39" with 37 rows rendered.
  // visibleExcept(e, "price") is the same rule set render() applies, minus this
  // group's own selection — so a label can never promise a number the list will
  // not deliver, whichever OTHER filters happen to be on. The sold-out toggle
  // keeps the corpus count, since that is what that chip is about.
  chipRow(
    $("#f-price"),
    ["free", "paid", "ticketed", "unknown"],
    (v) => ALL.filter((e) => e.priceTier === v && visibleExcept(e, "price")).length,
    {
      isOn: (v) => state.price.has(v),
      toggle: (v) => { state.price.has(v) ? state.price.delete(v) : state.price.add(v); },
    },
    // "Ticketed" is distinct from "Price not listed": the venue told us the
    // event is not free, we just could not read the amount. Collapsing them
    // made every film look like it might be free.
    { free: "Free", paid: "Paid", ticketed: "Ticketed", unknown: "Price not listed" },
    (e, v) => e.priceTier === v
  );


  // Availability is a two-state toggle rather than a multi-select: a sold-out
  // listing is either noise or the only thing you wanted, never both.
  const soldN = ALL.filter((e) => e.soldOut).length;
  const sh = $("#f-sold");
  sh.textContent = "";
  const sold = chip("Hide sold out", !state.hideSold, soldN);
  sold.classList.toggle("on", state.hideSold);
  sold.onclick = () => { state.hideSold = !state.hideSold; rebuildDayChips(); refreshChips(); render(); };
  sh.append(sold);

  // A venue with nothing left under it is dropped for the same reason a chip
  // is: choosing it would empty the list. "All venues" is always present so
  // the selection is never a one-way door.
  const venues = [...new Set(ALL.map((e) => e.venue))]
    .filter((v) => ALL.some((e) => e.venue === v && visibleExcept(e, "venue")))
    .sort((a, b) => a.localeCompare(b));
  const vs = $("#f-venue");
  vs.textContent = "";
  vs.append(new Option("All venues", ""));
  for (const v of venues) vs.append(new Option(v, v));
  vs.value = state.venue;
  // If the selected venue just filtered out of existence, fall back to All
  // rather than leaving a select whose value matches no option — the browser
  // would then show the first entry while the state still filtered by it.
  if (state.venue && !venues.includes(state.venue)) {
    state.venue = "";
    vs.value = "";
  }
}

/* ---------- city switching ----------
   load() replaces the old one-shot boot fetch. It is a named function because
   the switcher calls it again on every change: switching cities is not a
   re-render of the events already in memory, it is a different document with a
   different set of listings, its own day chips, its own neighborhood tally and
   its own filters.

   Filters are cleared on a switch rather than carried over. A hood selected in
   SF ("Mission") does not exist in Washington, so carrying it across would land
   the reader on an empty page that looks broken; and the day chips are rebuilt
   from the new feed, so a carried day filter could point at a date the new feed
   does not serve. The city itself is the state that persists. */
let loadingCity = null;

function loadCity(key) {
  const feed = CITIES[key].feed;
  // Guard against a double switch racing: the slower of two in-flight loads must
  // not overwrite the newer one's listings.
  const token = {};
  loadingCity = token;

  $("#err").hidden = true;
  $("#list").setAttribute("aria-busy", "true");

  return fetch(feed, { cache: "no-store" })
    .then((r) => {
      if (!r.ok) throw new Error(`${feed} ${r.status}`);
      return r.json();
    })
    .then(async (data) => {
      // A load that finished after the reader switched again is stale work.
      if (loadingCity !== token) return;
      // Levels ride along with the feed but must never block or break it, and
      // they are keyed by image URL across both cities, so they load once.
      if (!Object.keys(LEVELS).length) {
        try {
          const r = await fetch("image-levels.json", { cache: "no-store" });
          if (r.ok) { const j = await r.json(); if (j && typeof j === "object") LEVELS = j; }
          if (loadingCity !== token) return;
        } catch (_) { /* identity levels */ }
      }

      applyCityStrings();

      // Filters are per-city state, not per-visit state. See the note above.
      state.day = "";
      state.type.clear();
      state.price.clear();
      state.link.clear();
      state.hood.clear();
      state.venue = "";
      state.q = "";
      state.hideSold = true;
      state.onlyFree = false;
      $("#f-q").value = "";
      $("#only-free-input").checked = false;

      ALL = (data.events || []).map(sanitizeEvent);
      HOODS = data.neighborhoods || [];
      readURL();

      // day chips come from the feed so the labels always match the data
      rebuildDayChips();
      refreshChips();
      render();

      const g = new Date(data.generatedAt);
      $("#stamp").textContent =
        "Updated " +
        g.toLocaleString("en-US", {
          timeZone: CITIES[key].tz,
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });

      // If the rebuild ever fails, the listing keeps serving yesterday's window.
      // It would still look complete, so say so rather than letting stale dates
      // pass as current. A day-old feed is still worth showing; a two-day-old one
      // is a failure, and this is the only place a reader would learn of it.
      const ageH = (Date.now() - g.getTime()) / 36e5;
      if (ageH > 26) {
        const s = $("#stamp");
        s.textContent += " — may be out of date";
        s.classList.add("stale");
      }
      $("#list").removeAttribute("aria-busy");

      // The window being served. Declared HERE and not borrowed from
      // rebuildDayChips(): that function has its own `days`, which is a
      // different scope, so reading it here raised "days is not defined" and
      // the whole boot — including every listing — died in the catch below.
      // The range in the kicker is this page's actual window, so it has to come
      // from the data actually loaded.
      const days = [...new Set(ALL.map((e) => e.date))].sort();
      if (days.length) {
        const f = dayLabel(days[0]), l = dayLabel(days[days.length - 1]);
        $("#range").textContent = `${f.name === l.name ? "" : f.name + " "}${f.long} – ${l.name} ${l.long}`;
        // The short form is the same range without the weekday names, for the
        // phone header where the day chips already carry them.
        $("#range-s").textContent = `${f.short} – ${l.short}`;
      }
    })
    .catch((err) => {
      if (loadingCity !== token) return;
      loadingCity = null;
      $("#list").removeAttribute("aria-busy");
      $("#err").hidden = false;
      $("#err").textContent = "Could not load the listings (" + err.message + ").";
      $("#list").innerHTML = '<div class="empty"><p>The presses are stopped.</p></div>';
    });
}

// The switcher. The trigger is the city name itself; the menu is the only other
// thing on the page that exists because there is more than one city.
(function citySwitcher() {
  const btn = $("#place-btn");
  const menu = $("#place-menu");

  function setOpen(open) {
    menu.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
  }

  function choose(key) {
    setOpen(false);
    btn.focus();
    if (key === CITY) return; // re-picking the current city is a no-op, not a reload
    CITY = key;
    try { localStorage.setItem("city", key); } catch (_) { /* private mode */ }
    applyCityStrings();
    loadCity(key);
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    setOpen(menu.hidden);
    if (!menu.hidden) {
      const cur = menu.querySelector('[aria-checked="true"]');
      if (cur) cur.focus();
    }
  });

  menu.addEventListener("click", (e) => {
    const opt = e.target.closest(".place-opt");
    if (opt) choose(opt.dataset.city);
  });

  // A menu left open after the reader clicks the page is worse than no menu:
  // it covers the first listing. Close on any outside click and on Escape.
  document.addEventListener("click", (e) => {
    if (menu.hidden) return;
    if (!e.target.closest(".place")) setOpen(false);
  });
  document.addEventListener("keydown", (e) => {
    if (menu.hidden) return;
    if (e.key === "Escape") {
      setOpen(false);
      btn.focus();
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const opts = [...menu.querySelectorAll(".place-opt")];
      const at = opts.indexOf(document.activeElement);
      const next = e.key === "ArrowDown" ? (at + 1) % opts.length : (at - 1 + opts.length) % opts.length;
      e.preventDefault();
      opts[next].focus();
    }
  });
})();

// The stored choice is applied before the first load so the page never flashes

applyCityStrings();

// ---------------------------------------------------------------- collapse
// The filter rail has two states. On a wide screen the whole chip row shows

// filter that carries the page's premise stays reachable.
const bar = $("#bar");
  const mqNarrow = matchMedia("(max-width:720px)");

  // inner container the chips are built into. They are two DIFFERENT elements.
  // They were the same node once, and appending an element to itself throws
  // HierarchyRequestError — which killed every listener registered after
  // syncToViewport(), silently, with the page still rendering. Keeping them
  // distinct also means the guard in placeDayChips() is a real check rather
  // than the tautology `el.parentNode !== el`, which can never be false.
  const DAY_RAIL = $("#f-day-rail");
  const dayChips = $("#f-day");

  // flipping the bar has to refresh it — render() does not run on a toggle.

// Kept out of render() so either can call it.
function syncBadge() {
  const badge = $("#ftog-n");

  badge.classList.toggle("active", bar.dataset.collapsed === "true" && n > 0);
  badge.textContent = String(n);

function setBarH() {
  // The day headers stick at this offset, so it must be the bar's height
  // whenever the bar ITSELF is sticky — regardless of whether its filter panel
  // is open. It used to be 0 whenever the panel was closed (the default), so on
  // desktop every day header stuck at top:0 directly BEHIND the bar (z-index 20
  // vs 40) and was never visible. On a phone the bar is static, so 0 is right
  // there: a stale height would push the headers down for nothing. The panel is
  // absolutely positioned, so opening it does not change offsetHeight.
  const stuck = getComputedStyle(bar).position === "sticky";
  document.documentElement.style.setProperty("--barh", stuck ? bar.offsetHeight + "px" : "0px");

function placeDayChips() {
    // The day pickers live in the fixed header now, so there is exactly one
    // home and nothing to move. The old rail/panel split existed because the
    // chips were too tall for a phone; with the search and the free toggle also
    // in the fixed line, the panel holds only the remaining chip groups, and
    // the day pickers belong beside the logo.
    //

    // the container the chips are built into, so appending it to itself throws
    // "the new child element contains the parent" and kills the rest of the
    // boot. Kept as a function because every caller still wants the seam, and
    // a later layout with a second home would need it again.
    if (dayChips && dayChips.parentNode !== DAY_RAIL) DAY_RAIL.appendChild(dayChips);
  }

  setCollapsed(bar.dataset.collapsed !== "true");
  bar.dataset.userSet = "1";
});

function syncToViewport() {
  placeDayChips();

  // on a phone and force itself open on desktop — so the reader landed on a
  // wall of chips before seeing a single listing, which is the opposite of a
  // front page. A narrower window is no longer a reason to treat "closed" as
  // the default; it is the default everywhere.

  // choice survives an orientation change or a rotation.

// ---------------------------------------------------------------------------
// The wordmark appears only once the masthead has scrolled away.
// ---------------------------------------------------------------------------
// The trigger is the MASTHEAD leaving the viewport, not an arbitrary pixel
// count. Any threshold is a guess about how tall the masthead happens to be,
// and it is wrong the moment the standfirst wraps to a second line or the
// reader's font size differs from mine — the wordmark would appear while the
// masthead was still on screen (duplication) or long after it had gone (the
// bar looks broken on the way back up).
//
// An IntersectionObserver on the masthead measures the thing itself. With no
// `rootMargin` it reports "not intersecting" the moment the masthead's bottom
// edge passes the top of the viewport — which is exactly the boundary the
// reader perceives as "the header is gone", and the first moment the bar
// needs to be able to say which paper this is.
//
// The class is Toggled, not added. Scrolling back up has to remove the
// wordmark again, and an `add` that is never undone would leave it there
// permanently, contradicting the reason for hiding it in the first place.
const masthead = document.querySelector(".masthead");

// Measure the wordmark and hand its real width to CSS as `--brand-w-full`.
//
// Three things make this harder than it looks, and each one is a way the
// measurement silently returns the wrong number:
//
//   1. It must be measured UNCLIPPED. Measuring the collapsed box returns 0.
//   2. It must be measured AFTER the webfont lands. The fallback face is a
//      different width from Playfair, so a measurement taken at boot bakes in
//      the fallback and clips the real name.
//   3. It must be re-taken on resize, because a narrower viewport can change
//      the name's width if the font stack resolves differently.
//
// Rather than trying to time these perfectly, `measureBrand` is idempotent and
// cheap, and it writes the property only when the value actually changed —
// so it can be called from boot, from `fonts.ready`, and from `resize` without
// ever causing a layout thrash or a redundant style write.
function measureBrand() {
  const b = bar.querySelector(".brand");
  // The variable is READ on `.fbar-top` (the rule that sets `--brand-w`), so
  // it must be WRITTEN there too. Custom properties inherit DOWNWARD only: an
  // inline `--brand-w-full` on the .brand CHILD is invisible to the parent's
  // own `var(--brand-w-full)` lookup, and the declaration silently falls back
  // to the literal. That is the whole bug — the measurement was right and
  // nobody could see it.
  const host = bar.querySelector(".fbar-top") || bar;
  if (!b) return;
  // The width is measured on a Range over the LIVE text, not on a clone.
  //
  // The clone approach is wrong in a way that is invisible until you compare
  // numbers. The wordmark's styling comes from the DESCENDANT selector
  // `.fbar-top .brand b`. A clone appended to `document.body` is not inside a
  // `.fbar-top`, so that selector does not match it, the clone inherits the
  // body's default 16px Archivo instead of the intended 22px Playfair, and it
  // measures 113px. The live element measures 155px. The clone was reporting a
  // number that was confidently, repeatably wrong — and because the live box is
  // `overflow:hidden`, that wrong number is not a cosmetic error: it CLIPS the
  // wordmark to "FOG & FOI".
  //
  // A Range over the live node has none of those failure modes: it measures the
  // text as it is actually painted, in the real cascade, in the real font. The
  // element it wraps is the collapsed, clipped box; the Range is not, so it
  // returns the untruncated advance width.
  const text = b.querySelector("b") || b;
  const range = document.createRange();
  range.selectNodeContents(text);
  const w = Math.ceil(range.getBoundingClientRect().width);
  if (!w) return;   // slot is display:none at narrow widths — keep the last real measurement
  // A hairline of slack so the last glyph's right side bearing is inside the
  // clip rather than exactly flush with it, which reads as cut-off at 1x.
  const padded = w + 2;
  if (padded > 0 && host.style.getPropertyValue("--brand-w-full") !== padded + "px") {
    host.style.setProperty("--brand-w-full", padded + "px");
  }
}
measureBrand();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureBrand);
// A resize can change the resolved font (and the name's width with it).
addEventListener("resize", measureBrand);

// Rotating a phone crosses the 900px line in both directions, and the reveal is
// only wired up below it. Crossing UP must tear the observer down, or figures
// keep getting `.revealed` on a layout where hover is available again — which
// steals the pointer affordance on a tablet. Crossing DOWN must wire it up,
// or a reader who rotated gets a page full of permanently screened images.
//
// `mqPhone.addEventListener("change")` fires only when the query actually flips,
// so this is not a per-pixel resize handler. The debounce is not needed for
// that reason alone; it guards the case of dragging a desktop window across
// the breakpoint, where the flag flips repeatedly.
const mqPhone = matchMedia("(max-width:899px)");
let phoneCross = null;
mqPhone.addEventListener("change", (e) => {
  clearTimeout(phoneCross);
  phoneCross = setTimeout(() => {
    if (e.matches) {
      watchFigures();
    } else if (figureObserver) {

      // so the hover path starts from the same state a fresh load would give.
      figureObserver.disconnect();
      figureObserver = null;
      document.querySelectorAll(".figure.revealed").forEach((f) => f.classList.remove("revealed"));
    }

if (masthead && "IntersectionObserver" in window) {
  new IntersectionObserver(
    ([entry]) => {
      // `!entry.isIntersecting` is the signal to SHOW the bar's wordmark: the
      // masthead is off-screen (scrolled past, or above the viewport on the
      // way back up). At the very top of the page the masthead is fully
      // visible, so the bar correctly shows no wordmark of its own.
      bar.classList.toggle("scrolled", !entry.isIntersecting);
    },
    // A 1px shrink on the TOP. Without it the observer would stop reporting
    // while the masthead is still 1px on screen, which is the difference
    // between "gone" and "almost gone" and is visible as a late flip on the
    // way down and an early one on the way up.
    { rootMargin: "-1px 0px 0px 0px", threshold: 0 }
  ).observe(masthead);

  // the pre-scroll state of the page and is never wrong, only duplicative.
  bar.classList.add("scrolled");
}

// the unfiltered corpus: typing a search narrowed the list while the chips

// does not keep.
let qt;
$("#f-q").addEventListener("input", (e) => {
  clearTimeout(qt);
  qt = setTimeout(() => {
    state.q = e.target.value.trim();
    applyFilters();
  }, 120);
});
$("#f-venue").addEventListener("change", (e) => {
    state.venue = e.target.value;
    applyFilters();
  });
  // "Only Free" lives in the fixed header, left of the Filters button, so it is
  // reachable without opening the panel. It is a toggle, not a chip: it is on
  // or off, and it does not stack with the Price chips — the two would be
  // redundant, and a reader who picked "Free" in the panel would find the
  // toggle already on and wonder which one they clicked.
  $("#only-free-input").addEventListener("change", (e) => {
    state.onlyFree = e.target.checked;
    $("#only-free").classList.toggle("on", state.onlyFree);
    applyFilters();
  });
// The day rail exists twice in the markup (desktop + mobile). One set of chips
// is built here and moved by CSS, so the two copies cannot disagree or drift.
// Built here and called from boot, from the sold-out toggle and from reset —
// a count that does not move when the toggle moves is a promise the page
// cannot keep.
function rebuildDayChips() {
    const days = [...new Set(ALL.map((e) => e.date))].sort();
    // Built into the inner #f-day, not the #f-day-rail wrapper. The wrapper
    // holds the group's layout; the inner element is the chip list. Building
    // straight into the wrapper would put sibling .chip nodes in with the
    // wrapper's own padding/gap box and defeat the flex row.
    const dh = $("#f-day");
  dh.textContent = "";
  for (const d of days) {
    const n = ALL.filter((e) => e.date === d && visibleExcept(e, "day")).length;
    // A day with nothing left stays in the row, dimmed and inert, so the search
    // box and chips beside it never move. A selected day is never disabled.
    const b = chip(dayLabel(d).name, state.day === d, n, totalWhere((e) => e.date === d));
    b.disabled = n === 0 && state.day !== d;
    b.dataset.value = d;
    dh.append(b);
  }
  // The "All" chip is the day group with no day selected, so it counts through
  // every OTHER filter exactly as a day chip does. It used to count only
  // visibleNow(), which overstated it by the whole corpus whenever a type,
  // price, hood, venue or search was active.
  const allN = ALL.filter((e) => visibleExcept(e, "day")).length;
  const all = chip("All", !state.day, allN, totalWhere(() => true));
  all.dataset.value = "";
  dh.prepend(all);
  if (!dh.dataset.wired) {
    dh.dataset.wired = "1";
    dh.addEventListener("click", (ev) => {
      const b = ev.target.closest(".chip");
      if (!b || !dh.contains(b)) return;
      state.day = b.dataset.value === state.day ? "" : b.dataset.value;
      applyFilters();
    });
  }
}

$("#reset").onclick = () => {
  state.day = ""; state.type.clear(); state.price.clear(); state.link.clear(); state.hood.clear(); state.venue = ""; state.q = "";
  state.hideSold = true;
  $("#f-q").value = "";
  rebuildDayChips();
  refreshChips();
  render();
};
</script>
</body>
</html>
