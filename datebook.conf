# datebook.indigokarasu.com — The Pink Pages
# An unofficial revival of the SF Chronicle's Sunday entertainment section.
# Static build: index.html + events.json, regenerated by the fetch cron.
#
# Same content as pinkpages.indigokarasu.com. This hostname is the canonical
# one; the old name keeps resolving to an identical document.

server {
    listen 80;
    server_name datebook.indigokarasu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name datebook.indigokarasu.com;

    ssl_certificate     /etc/letsencrypt/live/datebook.indigokarasu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datebook.indigokarasu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/pinkpages.indigokarasu.com;
    index index.html;

    # Rewritten daily — never cached, so a visitor always sees the current three days.
    location = /events.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
